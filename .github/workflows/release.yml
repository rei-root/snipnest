name: Сборка артефактов

# Артефакты собираются по тегу: v0.2.0 -> v0.2.0.
# В Releases попадают бинарник, AppImage и пакет .deb.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Поставить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Поставить зависимости
        run: uv sync --frozen

      - name: Поставить системные библиотеки
        # Qt тянет libEGL, libGL, xkbcommon и dbus из системы: без них
        # pytest-qt падает на импорте QtGui ещё до первого теста.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libfuse2 imagemagick python3-venv

      - name: Поставить внешние программы
        # Модульные тесты собирают команду исполнителя, а для этого нужен
        # настоящий gallery-dl и yt-dlp — как на машине разработчика.
        run: |
          python3 -m venv /opt/snipnest-tools
          /opt/snipnest-tools/bin/pip install --no-cache-dir gallery-dl yt-dlp
          echo "/opt/snipnest-tools/bin" >> "$GITHUB_PATH"

      - name: Линтеры
        run: make lint

      - name: Типы
        run: make typecheck

      - name: Тесты
        run: |
          set +e
          uv run pytest tests -m "not live" --tb=short -q > /tmp/pytest.log 2>&1
          status=$?
          cat /tmp/pytest.log
          {
            echo "### Тесты"
            echo '```'
            cat /tmp/pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Тесты упали::$(tail -c 2000 /tmp/pytest.log | tr '\n' ' ')"
          fi
          exit $status

      - name: Оракул
        run: |
          set +e
          make oracle > /tmp/oracle.log 2>&1
          status=$?
          cat /tmp/oracle.log
          {
            echo "### Оракул"
            echo '```'
            cat /tmp/oracle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Собрать установщик
        run: make dist-installer

      - name: Собрать AppImage
        run: make dist-appimage

      - name: Собрать пакет .deb
        run: make dist-deb

      - name: Проверить артефакты
        run: make check-dist

      - name: Посчитать суммы
        run: |
          cd dist
          sha256sum snipnest-installer-*.bin *.AppImage *.deb > SHA256SUMS

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Установка на любой Linux:

            ```
            chmod +x snipnest-installer-linux-amd64.bin
            ./snipnest-installer-linux-amd64.bin
            ```

            Файл из релиза хранится без исполняемого бита — сначала `chmod +x`.

            Установщик сам определяет дистрибутив: на debian-based ставит
            пакет `.deb` через `apt-get`, на остальных кладёт переносимый
            образ в `/opt/snipnest` и делает лаунчер с ярлыком.
            Ключи: `--user`, `--dry-run`, `--local ФАЙЛ`, `--yes`, `--help`.
          files: |
            dist/snipnest-installer-*.bin
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS
          fail_on_unmatched_files: true

      - name: Убрать устаревшие файлы релиза
        # В релизе могли остаться файлы прошлой сборки (например, бинарник
        # приложения вместо установщика). Оставляем ровно то, что собрано
        # сейчас, — по списку файлов в dist/.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          tag="${GITHUB_REF_NAME}"
          keep=" $(cd dist && ls | tr '\n' ' ')"
          names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null)"
          for name in $names; do
            case "$keep" in
              *" $name "*) continue ;;
            esac
            echo "удаляю устаревший файл: $name"
            gh release delete-asset "$tag" "$name" --yes
          done
