[project]
name = "snipnest"
version = "0.1.0"
description = "GUI-обёртка над gallery-dl для скачивания изображений из Pinterest"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.6",
    "keyring>=24.0",
]

[project.scripts]
snipnest = "snipnest.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snipnest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --import-mode=importlib: имя модуля теста берётся из пути, а не из имени
# файла. Иначе два теста с одинаковым именем в разных каталогах (например
# test_ytdlp.py в unit и в integration) не собираются вместе.
addopts = "-q --import-mode=importlib"
# Драйвер знаменателя (tests/spec_mini/run_denominator.py) — не тест-файл по
# имени, но адресуется орком как `file::run`, поэтому pytest должен собирать
# функцию с этим именем. Других функций `run` в наборе нет: в тестах `run` —
# только методы вспомогательных классов, а классы эти не `Test*`.
python_functions = ["test_*", "run"]
markers = [
    "live: тесты, ходящие в сеть; требуют gallery-dl и доступа к Pinterest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
# Qt mandates camelCase for overridden event handlers.
"src/snipnest/ui/**" = ["N802"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/snipnest"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
