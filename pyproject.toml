[project]
name = "gallary-downloader"
version = "0.1.0"
description = "GUI-обёртка над gallery-dl для скачивания изображений из Pinterest"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "keyring>=24.0",
]

[project.scripts]
gallary-downloader = "gallary_downloader.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gallary_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: тесты, ходящие в сеть; требуют gallery-dl и доступа к Pinterest",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
# Qt mandates camelCase for overridden event handlers.
"src/gallary_downloader/ui/**" = ["N802"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/gallary_downloader"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true
