passability: 'Тот же оракул на ветке orch/014-ui-redesign с реализацией печатает «OK:
  аватарка, меню, тема и оформление на месте» и возвращает 0. Проверяется: логотип
  logo/snipnest.svg и символ logo/snipnest-symbolic.svg на месте, старый растр logo/snipnest.png
  из репозитория убран; тесты задачи зелёные — иконка приложения рисуется из SVG,
  у окна своя иконка, в шапке окна символ; строка меню «Файл», «Вид», «Справка» с
  указанным составом пунктов, кнопок настроек в верхней части окна не осталось, кнопки
  «Скачать» и «Выбрать папку» на месте, «Открыть Pinterest» удалена из приложения
  насовсем; окно настроек открывается из меню «Файл» и собирает папку сохранения,
  токен, cookies, пути к бинарникам и тему; тема переключается мгновенно (тёмная и
  светлая дают разные цвета окна), «Как в системе» следует системной схеме, выбор
  сохраняется в настройках, символ перекрашивается по теме; новая строка загрузки
  и лог появляются плавно; установщик кладёт PNG всех стандартных размеров и векторную
  иконку в scalable, а установка иконок не требует ImageMagick. Полный набор тестов
  зелёный, ruff и mypy — без замечаний, знаменатель обязательств 89/89. Тот же оракул
  на чистой основной ветке (реализация убрана, тесты и сам оракул на месте) даёт красный
  вывод выше: модулей snipnest.branding, snipnest.ui.theme, snipnest.ui.menus и snipnest.ui.settings_dialog
  ещё нет, логотипа и символа в репозитории нет.'
