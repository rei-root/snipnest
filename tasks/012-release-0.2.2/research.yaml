entries:
- id: SRC-I1
  phase: интервью
  kind: api
  title: 'Релизный конвейер Snipnest: версия пакета — единственный источник правды'
  findings: 'Как устроен релиз. 1) Версию пакета хранит одна строка — __version__
    в src/snipnest/__init__.py; от неё берутся имена артефактов (snipnest_<версия>_amd64.deb,
    snipnest-<версия>-linux-glibc-<glibc>-x86_64.AppImage) и адрес релиза (https://github.com/rei-root/snipnest/releases/download/v<версия>).
    2) Установщик — отдельная программа: build-installer.sh кладёт в его бандл installer-build-info.json
    с версией и адресом релиза, и установщик по этим сведениям качает образ нужной
    версии. Значит «установщик качает актуальную версию» ровно тогда, когда в пакете
    новая версия и установщик собран заново. 3) Артефакты собирает CI по тегу vX.Y.Z:
    пуш тега запускает сборку установщика, образа и пакета и выкладывает их в Releases.
    4) Проверка релиза (bin/check-release-version.sh) смотрит, что версия пакета совпадает
    с релизной, что имена артефактов и адрес релиза собраны из неё, что прежней версии
    нигде не осталось и что внутри собранного установщика лежат версия и адрес релиза.'
  url: https://github.com/rei-root/snipnest
  version: 0.2.1 (текущая версия пакета; предыдущий релиз — тег v0.2.1)
  currency_evidence: 'Прочитано в этой сессии: src/snipnest/__init__.py (версия пакета),
    packaging/common.sh (app_version, appimage_name, deb_name, release_url), packaging/build-installer.sh
    (сведения о сборке установщика), .github/workflows/release.yml (сборка по тегу
    v*), bin/check-release-version.sh (критерии релиза). Прежний релиз помечен тегом
    v0.2.1 в истории репозитория.'
  topics:
  - 'версия пакета: src/snipnest/__init__.py — единственный источник'
  - имена артефактов и адрес релиза собираются из версии
  - установщик запекает в себя версию и адрес релиза
  - CI собирает артефакты по тегу vX.Y.Z
  deprecated_apis: []
  applies_to:
  - package: snipnest
    version: 0.2.1
  recorded_at: '2026-11-26T17:57:37+00:00'
- id: SRC-I2
  phase: интервью
  kind: capabilities
  title: Возможности релиза и решения по ним
  findings: 'Владелец попросил выпустить следующую версию и обновить установщик так,
    чтобы он качал актуальную. Поскольку последняя версия 0.2.1 ниже 0.2.2, по его
    правилу повышается последнее число: новая версия — 0.2.2. Прежняя версия должна
    исчезнуть из кода, тестов и README: иначе проверка релиза её найдёт, а читатель
    увидит две разные версии. Проверка релиза переписывается под новую версию — она
    и есть оракул задачи. Тег ставит оркестратор после слияния в main: по нему CI
    собирает установщик, образ и пакет и выкладывает их в Releases.'
  url: https://github.com/rei-root/snipnest
  version: правила репозитория и конвейер релиза текущего состояния
  currency_evidence: 'Решения опираются на чтение конвейера в этой сессии (SRC-I1)
    и на решение владельца о версии: «повысь версию до 0.2.3 (если последняя была
    0.2.2, если последняя ниже, просто повысь последнее число)» — последняя версия
    0.2.1 ниже 0.2.2, значит повышается последнее число.'
  topics:
  - поднять версию пакета до 0.2.2
  - убрать прежнюю версию из кода, тестов и README
  - проверка релиза под новую версию
  - поставить тег и собрать релиз
  deprecated_apis: []
  applies_to:
  - package: snipnest
    version: 0.2.1
  capabilities:
  - id: C-1
    name: Поднять версию пакета до 0.2.2
    decision: нужно
    rationale: 'Прямая просьба владельца: выпустить следующую версию. Версия пакета
      — единственный источник для имён артефактов и адреса релиза, поэтому одно изменение
      поднимает и релиз.'
  - id: C-2
    name: Убрать прежнюю версию из кода, тестов и README
    decision: нужно
    rationale: 'Прежняя версия осталась бы в тесте версии и в командах установки пакета
      в README: читатель увидел бы разные версии, а проверка релиза её нашла.'
  - id: C-3
    name: Переписать проверку релиза под новую версию
    decision: нужно
    rationale: 'Проверка релиза — оракул задачи: она должна падать на прежней версии
      и проходить на новой.'
  - id: C-4
    name: Поставить тег v0.2.2 и собрать релиз
    decision: нужно
    rationale: По тегу CI собирает установщик, образ и пакет и выкладывает их в Releases;
      без тега релиз не существует, а установщик не сможет качать новую версию.
  - id: C-5
    name: Пересобрать и переустановить приложение у владельца на месте
    decision: отложено
    rationale: У владельца приложение запускается из исходников (лаунчер в ~/.local/bin),
      и новый код там уже есть после слияния. Пересборка образов — дело CI по тегу;
      отдельно пересобирать их на машине владельца незачем.
  recorded_at: '2026-11-26T17:57:37+00:00'
- id: SRC-I3
  phase: код
  kind: api
  title: Контракт, на который опирается код релиза
  findings: 'Что код делает с контрактом. 1) Версия пакета меняется одной строкой
    в src/snipnest/__init__.py; больше нигде она не дублируется в коде. 2) Тест версии
    (tests/unit/test_packaging_scope.py) сверяет версию пакета с релизной — его ожидание
    меняется вместе с ней. 3) README в двух местах показывает имя пакета для установки
    (snipnest_<версия>_amd64.deb) — там же версия. 4) Имена артефактов, адрес релиза
    и сведения о сборке установщика вычисляются из версии пакета, поэтому отдельной
    правки не требуют: сборщик возьмёт новую версию сам. 5) Проверка релиза (bin/check-release-version.sh)
    проверяет ровно эти четыре вещи: версия пакета, имена артефактов и адрес релиза,
    отсутствие прежней версии, сведения о сборке внутри установщика. 6) Компоненты
    (gallery-dl, yt-dlp, yt-dlp-ejs, deno, ffmpeg) и конвейер сборки не трогаются:
    версии компонентов закреплены отдельно и меняются отдельными задачами.'
  url: https://github.com/yt-dlp/yt-dlp/wiki/PO-Token-Guide
  version: правила репозитория текущего состояния; версии компонентов — 2026.11.23
    и 0.8.0
  currency_evidence: Контракт сверен с кодом проекта в этой сессии (src/snipnest/__init__.py,
    packaging/common.sh, packaging/build-installer.sh, bin/check-release-version.sh,
    tests/unit/test_packaging_scope.py, README.md) и с приёмкой задач 010 и 011, принятых
    владельцем в этой же сессии.
  topics:
  - 'что меняется в коде: одна строка версии, ожидание в тесте, имя пакета в README'
  - 'что не меняется: компоненты, конвейер сборки, имя установщика'
  - 'как проверяется: скрипт проверки релиза'
  deprecated_apis: []
  applies_to:
  - package: snipnest
    version: 0.2.1
  recorded_at: '2026-11-26T17:57:37+00:00'
