connectivity: связные
rationale: ''
requirements:
- id: R1
  text: 'Владелец принял работу по выбору формата сохранения и по обновлению yt-dlp
    и просит выпустить следующую версию: «дополнительно повысь версию до 0.2.3 (если
    последняя была 0.2.2, если последняя ниже, просто повысь последнее число)». Последняя
    версия — 0.2.1, она ниже 0.2.2, значит по его правилу повышается последнее число:
    новая версия — 0.2.2. Второе пожелание: «обнови установщик, что бы качал актуальную
    версию» — установщик берёт версию и адрес релиза из своих сведений о сборке, а
    те собираются из версии пакета, поэтому установщик, собранный из 0.2.2, качает
    именно релиз 0.2.2.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-o5GBAA/interview-012.yaml
  capabilities:
  - C-1
  - C-4
- id: R2
  text: 'Пользователь один — владелец; приложение личное и локальное, у него же и
    своя машина, и свой канал релизов. Новых ролей и внешних сервисов не появляется:
    релиз собирает тот же CI на том же теге.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-o5GBAA/interview-012.yaml
- id: R3
  text: '1) Версия пакета — 0.2.2. 2) Прежней версии 0.2.1 не остаётся нигде: ни в
    коде, ни в тестах, ни в README — иначе читатель увидит две разные версии. 3) Проверка
    релиза переписана под 0.2.2: на прежней версии она падает, на новой проходит.
    4) В README имя пакета для установки — snipnest_0.2.2_amd64.deb. 5) После слияния
    в main ставится тег v0.2.2: по нему CI собирает установщик, образ и пакет и выкладывает
    их в Releases. 6) Собранный из 0.2.2 установщик качает релиз 0.2.2: адрес собирается
    из версии, и в его сведениях о сборке лежат версия и адрес релиза.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-o5GBAA/interview-012.yaml
  capabilities:
  - C-1
  - C-2
  - C-3
  - C-4
- id: R4
  text: '1) Версия меняется в одном месте — в пакете; остальное вычисляется из неё.
    2) Компоненты (gallery-dl, yt-dlp, yt-dlp-ejs, deno, ffmpeg) и конвейер сборки
    не трогаются: их версии закреплены отдельно и меняются отдельными задачами. 3)
    Тег ставится один раз, после слияния задачи в main, и указывает на тот коммит,
    что в main. 4) Нормативная модель предметной области не меняется, 89 обязательств
    остаются в силе: релиз — это параметр окружения, а не поле модели. 5) История
    git не переписывается: релиз добавляется к ней, а не заменяет её.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-o5GBAA/interview-012.yaml
  capabilities:
  - C-2
- id: R5
  text: 'тесты, кроме помеченных live, в сеть не ходят; правила репозитория прежние:
    ruff с line-length 100, mypy --strict, не больше 300 строк на файл; знаменатель
    обязательств остаётся 89/89; проверка релиза работает без сети и без собранных
    артефактов — четвёртый критерий пропускается, если установщик не собран.'
  nfr: true
  source: /tmp/delta-scratch-.delta-fs-o5GBAA/interview-012.yaml
- id: R6
  text: 'вне задачи: пересборка образов на машине владельца (это делает CI по тегу),
    обновление версий компонентов, изменение конвейера сборки и имён артефактов, изменение
    нормативной модели предметной области, переписывание истории git и правка прежних
    тегов.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-o5GBAA/interview-012.yaml
acceptance_criteria:
- id: AC1
  text: 1) Версия пакета — 0.2.2. 2) Прежней версии 0.2.1 нет ни в коде, ни в тестах,
    ни в README. 3) Проверка релиза проходит на новой версии и падает на прежней.
    4) Имя пакета, имя образа и адрес релиза собраны из 0.2.2, а в сведениях о сборке
    установщика лежат версия 0.2.2 и адрес v0.2.2. 5) Полный прогон тестов, типов
    и линтеров зелёный, знаменатель 89/89. 6) После слияния задачи в main стоит тег
    v0.2.2 на коммите main.
