    "last_ba_input": "1) собирается dist/snipnest-installer-linux-amd64.bin — один файл установщика, приложения внутри нет; 2) установщик определяет семейство дистрибутива по /etc/os-release: debian-based, arch-based, rhel-based, suse-based, gentoo, alpine — и всё, что не опознано; 3) на debian-based ставит .deb через apt-get (запасной путь — dpkg); 4) на остальных кладёт переносимый образ в /opt/snipnest, делает лаунчер в /usr/local/bin, ярлык в /usr/share/applications и иконки в /usr/share/icons/hicolor; 5) ключ --user ставит всё в домашний каталог, без прав root; 6) ключ --dry-run печатает план и ничего не делает; 7) ключ --local ставит из локального файла, без сети; 8) установщик скачивает файл из релизов и проверяет его по SHA256SUMS; 9) перед установкой проверяется версия glibc: если она ниже нужной, установщик говорит об этом и не ставит; 10) перед установкой в систему установщик спрашивает подтверждение, ключ --yes отвечает заранее; 11) AppImage собирается как приложение, установщика внутри нет; 12) имя AppImage содержит платформу, версию glibc и архитектуру: snipnest-<версия>-linux-glibc-<версия>-x86_64.AppImage; 13) пакет .deb не меняется."
