    "last_ba_input": "1) make dist-installer собирает dist/snipnest-installer-linux-amd64.bin — один файл установщика; 2) установщик запускается как ./snipnest-installer-linux-amd64.bin --help и печатает справку; 3) установщик с ключом --dry-run на debian-, arch-, rhel- и на неизвестной системе печатает разный план: для debian — установку .deb через apt-get, для остальных — образ в /opt с лаунчером и ярлыком; 4) с ключом --user план ставит всё в домашний каталог; 5) внутри файла установщика нет приложения: в нём нет ни одного ELF-файла приложения и нет каталога _internal; 6) AppImage собирается как приложение: внутри него нет установщика, зато есть .desktop, иконка и AppRun; 7) имя AppImage содержит платформу, версию glibc и архитектуру; 8) пакет .deb собирается как раньше и не меняется; 9) полный прогон тестов, типов и линтеров зелёный, знаменатель 89/89."
