connectivity: связные
rationale: ''
requirements:
- id: R1
  text: 'Пользователь скачал с релиза snipnest_0.2.0_amd64.deb и snipnest-installer-linux-amd64.bin
    и не смог поставить приложение. Установщик скачал пакет и остановился на apt-get:
    «E: В командной строке указан неподдерживаемый файл .//tmp/tmp.xtQH7wOGFL/snipnest_0.2.0_amd64.deb».
    При ручной установке пакета apt напечатал «Уведомление: Загрузка выполняется от
    лица суперпользователя без ограничений песочницы, так как файл …/snipnest_0.2.0_amd64.deb
    недоступен для пользователя „_apt“ — pkgAcquire::Run (13: Отказано в доступе)»,
    и человек решил, что пакет сломан. Проверено: сам пакет в порядке — права файлов
    внутри него верные, dpkg ставит его без ошибок; не годятся путь, который установщик
    передаёт apt, и сообщение о песочнице, появляющееся из-за недоступного служебному
    пользователю файла.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
- id: R2
  text: 'Владелец проекта — он же заказчик: решения об ограничениях принимает он.
    Конечный пользователь — обычный человек с Linux-машиной: у него нет Python, нет
    желания разбираться в форматах и нет прав администратора по умолчанию. Сборщик
    — CI, который собирает артефакты по тегу и кладёт их в Releases.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
- id: R3
  text: '1) установщик передаёт apt-get путь к пакету в том виде, в каком apt его
    принимает: абсолютный путь к файлу либо путь, начинающийся с «./»; путь вида «.//tmp/…»
    не строится никогда; 2) на debian-системе установщик ставит пакет и завершается
    с кодом 0; 3) если apt-get нет или отказался, установщик ставит пакет через dpkg
    и говорит, каким способом поставил; 4) перед вызовом apt-get файл пакета доступен
    служебному пользователю apt (_apt): каталог с пакетом имеет права 0755, сам файл
    — 0644; тогда apt работает в песочнице и не печатает сообщения о доступе; 5) установщик
    печатает итог: что поставлено, чем и куда; 6) перед установкой в систему установщик
    спрашивает подтверждение; 7) README и страница релиза говорят, что скачанный файл
    надо сделать исполняемым (chmod +x) перед запуском: ассет релиза не несёт прав
    файловой системы, и браузер сохраняет его без исполняемого бита; 8) пакет .deb
    по раскладке, составу и правам файлов не меняется.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
- id: R4
  text: '1) установщик не трогает чужие файлы: свои пути проверяет и о перезаписи
    предупреждает; 2) права администратора берутся только когда они действительно
    нужны — для системных каталогов; 3) установщик не ломает систему: пакетным менеджером
    он ставит только свой пакет; 4) установка идёт только в системные каталоги (/usr/lib/snipnest,
    /usr/bin/snipnest, /usr/share/applications, /usr/share/icons) либо, с ключом --user,
    в домашний каталог; 5) компоненты (gallery-dl, yt-dlp, ffmpeg) установщик не ставит
    — этим занимается мастер внутри приложения; 6) проверка версии glibc до установки
    остаётся.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
- id: R5
  text: '1) архитектура только amd64, версия 0.2.0; 2) правила репозитория прежние:
    ruff с line-length 100, mypy --strict, не больше 300 строк на файл; 3) установщик
    остаётся POSIX shell и работает там, где есть /bin/sh: графический установщик
    — отдельная задача; 4) тесты, кроме помеченных live, в сеть не ходят; 5) знаменатель
    обязательств остаётся 89/89, нормативная модель не меняется; 6) артефакты собираются
    в CI по тегу и выкладываются в Releases.'
  nfr: true
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
- id: R6
  text: 'вне задачи: графический установщик на Qt, сборка под arm64 и другие архитектуры,
    Windows и macOS, собственные .rpm и .pkg.tar.zst, автообновление установщика,
    подпись артефактов, flatpak и snap, изменение нормативной модели предметной области
    и её 89 обязательств, переписывание дословных цитат интервью T2, изменение истории
    git.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
acceptance_criteria:
- id: AC1
  text: '1) на debian-системе установщик передаёт apt-get путь к пакету, который apt
    принимает: подставной apt-get печатает свои аргументы, и среди них нет пути, начинающегося
    с «.//»; 2) если apt-get отказывается, установщик ставит пакет через dpkg и печатает,
    что поставил через dpkg; 3) файл пакета, который видит apt-get, лежит в каталоге
    с правами 0755, а сам файл имеет права 0644 — служебный пользователь apt его читает;
    4) в тексте установщика и в README есть указание, что скачанный из релиза файл
    нужно сделать исполняемым (chmod +x) перед запуском; 5) пакет .deb собирается
    как раньше: раскладка и состав файлов не меняются; 6) полный прогон тестов, типов
    и линтеров зелёный, знаменатель 89/89.'
  source: /tmp/delta-scratch-.delta-fs-XtzfnD/interview-007.yaml
