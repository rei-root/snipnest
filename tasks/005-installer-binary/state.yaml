    "last_ba_input": "1) собирается один исполняемый бинарник snipnest (onefile), который запускается на машине без Python в системе; 2) собирается AppImage: AppDir с AppRun, desktop-файлом и иконкой, упакованный в образ type 2; 3) собирается .deb для debian-based: файлы приложения в /usr/lib/snipnest, лаунчер в /usr/bin/snipnest, ярлык в /usr/share/applications, иконки в /usr/share/icons; Depends — только libc6, всё остальное внутри пакета; 4) в приложении есть мастер установки компонентов: дерево с корневым пунктом «Обеспечить все компоненты» и пятью дочерними пунктами (gallery-dl, yt-dlp, yt-dlp-ejs, deno, ffmpeg), у каждого свой чекбокс; 5) корневой пункт отмечен по умолчанию, снятие корневой галочки снимает все, ручная отметка части детей переводит корневой пункт в состояние «частично»; 6) у каждого компонента показан статус: «уже установлен в системе», «будет скачано, ~12 МБ» или «установлен системным пакетом»; 7) компоненты ставятся в ~/.local/share/snipnest/components/<имя>/ без прав root; 8) мастер показывается при первом запуске и вызывается из интерфейса кнопкой «Компоненты…»; 9) приложение находит установленные компоненты и использует их вместо системных, если те есть; 10) Python-компоненты (gallery-dl, yt-dlp, yt-dlp-ejs) ставятся переносимым CPython, входящим в артефакт, и запускаются им; 11) deno и ffmpeg ставятся готовыми бинарниками; 12) в .deb компоненты предустановлены в /usr/lib/snipnest/components, и мастер показывает их как установленные.",
