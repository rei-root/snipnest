    "last_ba_input": "1) make dist-onefile собирает один исполняемый файл, который запускается на машине без Python и показывает окно приложения; 2) make dist-appimage собирает AppImage: образ содержит .desktop, иконку и AppRun, а приложение после запуска появляется в меню; 3) make dist-deb собирает .deb, который проходит dpkg-deb --info и dpkg-deb --contents, распаковывается в отдельный корень через dpkg-deb -x и содержит лаунчер /usr/bin/snipnest, ярлык и иконки; 4) в .deb лежат все пять компонентов, и приложение после установки пакета находит их без сети; 5) мастер компонентов показывает дерево с корневым пунктом и пятью детьми, корневой пункт отмечен по умолчанию; 6) снятие корневой галочки снимает все дочерние, отметка одного ребёнка переводит корневой пункт в «частично»; 7) компонент, найденный в PATH, отмечен и помечен как уже установленный и не скачивается повторно; 8) установка отмеченного компонента кладёт его в ~/.local/share/snipnest/components и приложение начинает его использовать; 9) установка идёт в отдельном потоке, окно не подвисает; 10) полный прогон тестов, типов и линтеров зелёный, знаменатель 89/89.",
