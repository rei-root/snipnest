    "last_ba_input": "1) ссылка на YouTube в то же поле ссылки распознаётся как YouTube-источник: обычное видео (watch?v=...), короткая ссылка youtu.be, Shorts (/shorts/...), а также /live/ и /embed/; 2) загрузку YouTube выполняет внешний бинарник yt-dlp — у gallery-dl своего экстрактора YouTube нет, — и приложение находит его в PATH либо по пути, который владелец указал в настройках «Путь к yt-dlp»; 3) ролик скачивается в выбранную папку одним файлом: лучшее доступное качество, видео и звук склеиваются в mp4 средствами ffmpeg, имя файла — «Название [id].mp4»; 4) во время загрузки окно показывает настоящий процент выполнения и текущую скорость, а не пустой прогресс до самого конца; 5) вывод yt-dlp, включая предупреждения, виден в логе приложения, а ошибка yt-dlp (ролик недоступен, возрастное ограничение, проверка бота) показывается владельцу и переводит загрузку в состояние «ошибка»; 6) уже скачанный файл не перекачивается — такая загрузка считается пропущенной; 7) поведение Pinterest не меняется: то же поле ссылки, та же папка сохранения, тот же список загрузок, тот же итог «скачано / пропущено / ошибок».",
