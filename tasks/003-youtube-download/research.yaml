entries:
- id: SRC-I1
  phase: интервью
  kind: api
  title: 'yt-dlp 2026.10.26 — параметры командной строки: формат, склейка, путь, имя
    файла, прогресс'
  findings: 'Параметры, на которых держится загрузка YouTube, и что именно они делают.
    1) --paths/-P задаёт каталог, -o/--output — шаблон имени; вместе дают файл прямо
    в выбранной папке: -P <папка> -o ''%(title)s [%(id)s].%(ext)s'' кладёт ролик в
    папку под именем «Название [id].mp4», без своих подкаталогов. 2) -f/--format выбирает
    потоки, --merge-output-format mp4 склеивает видео и звук в mp4 (нужен ffmpeg);
    выражение ''bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]/bv*+ba/b'' берёт mp4-видео и m4a-звук,
    а при отсутствии — любой доступный формат. 3) --print-to-file ''[WHEN:]TEMPLATE
    FILE'' пишет шаблон в файл; ключ after_move срабатывает после постобработки, поэтому
    %(filepath)s даёт имя итогового файла после склейки — README прямо предупреждает,
    что из-за постобработки имя может отличаться, и велит брать after_move. Порядок
    аргументов: сначала шаблон, потом файл. 4) Важно: --print (без -to-file) включает
    тихий режим, и тогда прогресс не печатается вовсе; --print-to-file тихий режим
    не включает, поэтому прогресс и путь файла не конфликтуют. 5) --newline печатает
    прогресс построчно, строки вида ''[download]  45.2% of 100.00MiB at 5.00MiB/s
    ETA 00:12'' разбираются регулярным выражением. 6) --no-playlist ограничивает загрузку
    одним видео, даже если в ссылке есть список воспроизведения. 7) Информационная
    строка ''[info] <id>: Downloading 1 format(s): 394+251'' перечисляет потоки, по
    ней видно, сколько их всего — это нужно, чтобы считать общий процент, а не процент
    одного потока. 8) Сообщение ''[download] <путь> has already been downloaded''
    означает, что файл уже есть и качать его не нужно.'
  url: https://github.com/yt-dlp/yt-dlp
  version: '2026.10.26 (установлен в системе: /usr/bin/yt-dlp, yt-dlp --version)'
  currency_evidence: Установленный бинарь отдаёт версию 2026.10.26; README прочитан
    в этой сессии из master-ветки официального репозитория (raw.githubusercontent.com/yt-dlp/yt-dlp/master/README.md),
    раздел OUTPUT TEMPLATE и справка по --print-to-file/--progress-template/--newline;
    справка установленного бинаря (yt-dlp --help) совпадает с этим README.
  topics:
  - '--paths/-P и --output: файл в выбранной папке, имя «Название [id].mp4»'
  - '--print-to-file с when=after_move: имя итогового файла после склейки'
  - --print включает тихий режим и глушит прогресс, --print-to-file — нет
  - '--newline: построчный прогресс, разбираемый регулярным выражением'
  - '-f/--format и --merge-output-format mp4: склейка видео и звука'
  - '--no-playlist: одна ссылка — одно видео'
  - 'строка ''[info] ...: Downloading N format(s): ...'': сколько всего потоков'
  - '''has already been downloaded'': файл уже скачан'
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  recorded_at: '2026-11-19T10:59:46+00:00'
- id: SRC-I2
  phase: интервью
  kind: api
  title: yt-dlp wiki EJS — JS-рантайм и скрипты челленджера для YouTube
  findings: 'YouTube в yt-dlp требует внешнего JavaScript-рантайма: ''To download
    from YouTube, yt-dlp needs to solve JavaScript challenges presented by YouTube
    using an external JavaScript runtime''. Поддерживаемые рантаймы: deno (включён
    по умолчанию), node (включается только флагом --js-runtimes node), quickjs, bun
    (устарел). Скрипты челленджера (пакет yt-dlp-ejs) нужны для подписи потоков: без
    них yt-dlp пишет предупреждения ''Signature solving failed: Some formats may be
    missing'' и ''n challenge solving failed'', но загрузку не отменяет — это предупреждение,
    а не ошибка. Способы получить скрипты: пакет yt-dlp-ejs, официальный исполняемый
    файл yt-dlp (скрипты внутри) или --remote-components ejs:github (скачивание с
    GitHub по требованию) — последнее тянет и выполняет код из сети, поэтому решение
    об этом остаётся за владельцем. Проверено на машине владельца: deno не установлен,
    node есть (/usr/bin/node, v24.22.3), пакет yt-dlp-ejs не установлен; с --js-runtimes
    node предупреждение о рантайме исчезает, список форматов ролика совпадает со списком
    без челленджера, а загрузка проходит.'
  url: https://github.com/yt-dlp/yt-dlp/wiki/EJS
  version: master-ветка wiki (прочитана в этой сессии)
  currency_evidence: 'Страница wiki прочитана по адресу raw.githubusercontent.com/yt-dlp/yt-dlp-wiki/master/EJS.md
    в этой сессии; утверждения сверены с установленным yt-dlp 2026.10.26: предупреждение
    ''No supported JavaScript runtime could be found'' и ''Signature solving failed''
    воспроизведены на этой машине, а загрузка ролика после --js-runtimes node прошла
    успешно.'
  topics:
  - 'JS-рантайм для YouTube: deno по умолчанию, node через --js-runtimes node'
  - 'скрипты челленджера yt-dlp-ejs: пакет, встроенные скрипты или --remote-components
    ejs:github'
  - без челленджера yt-dlp предупреждает о части форматов, но не отменяет загрузку
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  recorded_at: '2026-11-19T10:59:46+00:00'
- id: SRC-I3
  phase: интервью
  kind: capabilities
  title: Возможности, найденные для загрузки видео с YouTube, и решения по ним
  findings: 'Загрузка видео с YouTube упирается в десять технических решений: кто
    и чем качает, как узнаётся ссылка, как называется итоговый файл, как показывается
    прогресс, что делает приложение с плейлистом, как выбирается формат и чем склеивается
    видео со звуком, нужен ли JS-рантайм, откуда берутся скрипты челленджера и как
    обойтись без доступа к закрытым роликам. По каждому принято решение — нужно, не
    нужно или отложено — с причиной. Три из них владельцу не придётся решать: источник
    определяется по домену и виду ссылки, имя файла и путь задаёт yt-dlp по шаблону,
    а формат и склейка укладываются в предпочтение mp4.'
  url: https://github.com/yt-dlp/yt-dlp
  version: 2026.10.26
  currency_evidence: 'Решения опираются на две свежие редакции документации (README
    yt-dlp 2026.10.26 и wiki EJS), прочитанные в этой сессии, и на проверки на машине
    владельца: yt-dlp 2026.10.26 скачал обычный ролик, ролик по ссылке /shorts/ и
    показал нужные строки вывода; gallery-dl 1.32.15 собственного экстрактора YouTube
    не имеет.'
  topics:
  - исполнитель загрузки для YouTube
  - 'распознавание ссылок YouTube: watch, youtu.be, shorts, live, embed'
  - имя итогового файла и его путь
  - прогресс и скорость во время загрузки
  - поведение при ссылке на плейлист
  - выбор формата и склейка видео со звуком
  - JS-рантайм для YouTube
  - 'скрипты челленджера: локальные или удалённые'
  - доступ к закрытым и возрастным роликам
  - 'сопутствующие файлы: субтитры и обложки'
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  capabilities:
  - id: C-1
    name: Загрузку YouTube выполняет бинарник yt-dlp, найденный в PATH или по пути
      из настроек
    decision: нужно
    rationale: 'gallery-dl своего экстрактора YouTube не имеет (в списке экстракторов
      только ytdl:, который делегирует youtube-dl), а yt-dlp в системе владельца уже
      стоит и работает: скачал и обычный ролик, и ролик по ссылке /shorts/. Без отдельного
      исполнителя видео с YouTube не скачать.'
  - id: C-2
    name: Имя итогового файла берётся из after_move:filepath, а не из строки «Destination»
    decision: нужно
    rationale: 'Строка «[download] Destination: ...» указывает на временный файл потока,
      а не на итоговый: после склейки имя другое. Только after_move даёт путь к готовому
      файлу — README прямо предупреждает об этом.'
  - id: C-3
    name: Прогресс и скорость берутся из построчного вывода yt-dlp (--newline)
    decision: нужно
    rationale: 'Для ролика на полтора часа счётчик «скачано 0 из 1» до конца не говорит
      владельцу ничего: нужен настоящий процент и текущая скорость, а они есть в строках
      «[download] ...% of ... at ...».'
  - id: C-4
    name: 'Одна ссылка — одно видео: плейлист не скачивается целиком'
    decision: нужно
    rationale: Запрос владельца — «качать видео», а не «качать плейлист». Без --no-playlist
      ссылка с параметром list утянула бы весь плейлист, и загрузка перестала бы быть
      одной папкой-одним-файлом.
  - id: C-5
    name: Лучшее доступное качество со склейкой видео и звука в mp4 средствами ffmpeg
    decision: нужно
    rationale: YouTube отдаёт видео и звук отдельными потоками, поэтому без склейки
      файла не будет. mp4 (H.264 и AAC) выбран потому, что такой файл играется везде;
      ffmpeg в системе владельца стоит.
  - id: C-6
    name: JS-рантайм (deno или node) подключается, только если он уже установлен в
      системе
    decision: нужно
    rationale: Без рантайма yt-dlp предупреждает, что извлечение YouTube устарело
      и часть форматов пропадёт. На машине владельца node уже есть, а deno нет, поэтому
      рантайм надо находить самому, а не требовать от владельца.
  - id: C-7
    name: Удалённые скрипты челленджера (--remote-components ejs:github)
    decision: отложено
    rationale: 'Это способ заставить yt-dlp скачивать и выполнять код из сети. Скачивание
      роликов при этом работает и без него, а решение о доверии к GitHub остаётся
      за владельцем: в приложении оно описано в README, но не включается само.'
  - id: C-8
    name: 'Экстрактор ytdl: в gallery-dl вместо отдельного исполнителя'
    decision: не_нужно
    rationale: Он требует, чтобы модуль yt_dlp был импортируем для интерпретатора
      gallery-dl, и прячет вызов в два слоя. Отдельный исполнитель yt-dlp с собственными
      настройками пути и разбором вывода понятнее и не зависит от того, как gallery-dl
      устроен изнутри.
  - id: C-9
    name: Cookie-файл браузера для возрастных ограничений и закрытых роликов (--cookies-from-browser)
    decision: отложено
    rationale: Запрос владельца — обычные ролики, shorts и длинные видео. Cookie браузера
      — отдельная настройка с доверием к личным данным; если ролик не скачается из-за
      ограничения, сообщение об ошибке подскажет, куда смотреть.
  - id: C-10
    name: Субтитры и обложки (--write-subs, --write-thumbnail)
    decision: не_нужно
    rationale: Владелец просил сохранить видео; сопутствующие файлы в выбранной папке
      только мешали бы правилу «один файл — одно видео».
  recorded_at: '2026-11-19T10:59:46+00:00'
- id: SRC-I4
  phase: интервью
  kind: api
  title: 'gallery-dl 1.32.15 — своего экстрактора YouTube нет, есть только делегирование
    ytdl:'
  findings: 'В установленном gallery-dl 1.32.15 нет сайта YouTube: gallery-dl --list-sites
    не содержит youtube, а в --list-extractors есть только YoutubeDLExtractor с шаблоном
    ''ytdl:(.*)'' — то есть обычную ссылку https://www.youtube.com/watch?v=... он
    не понимает, понимает лишь с префиксом ytdl:. Этот экстрактор не качает сам: он
    импортирует модуль yt_dlp (gallery_dl/ytdl.py, extractor/ytdl.py — ''import main
    youtube_dl module'') и строит объект YoutubeDL, а скачивание идёт через downloader/ytdl.py.
    Итог: gallery-dl для YouTube — это мост к yt-dlp с лишним слоем и зависимостью
    от того, что модуль yt_dlp импортируется интерпретатором gallery-dl. Вывод для
    задачи: YouTube берёт отдельный исполнитель yt-dlp, gallery-dl остаётся исполнителем
    Pinterest, и оба живут за слоем источников.'
  url: https://github.com/mikf/gallery-dl
  version: '1.32.15 (установлен в системе: /usr/bin/gallery-dl, gallery-dl --version)'
  currency_evidence: 'Проверено на установленном бинаре в этой сессии: gallery-dl
    --list-sites | grep -i youtube не даёт ни одной строки, --list-extractors показывает
    только YoutubeDLExtractor с префиксом ytdl:, а исходники экстрактора и загрузчика
    прочитаны в /usr/lib/python3/dist-packages/gallery_dl.'
  topics:
  - в списке сайтов gallery-dl нет YouTube
  - 'YoutubeDLExtractor работает только с префиксом ytdl:'
  - 'экстрактор ytdl: импортирует модуль yt_dlp и отдаёт загрузку downloader/ytdl.py'
  deprecated_apis: []
  applies_to:
  - package: gallery-dl
    version: 1.32.15
  recorded_at: '2026-11-19T10:59:46+00:00'
- id: SRC-C1
  phase: код
  kind: api
  title: yt-dlp 2026.10.26 — контракт командной строки, на который опирается исполнитель
  findings: 'Контракт, который использует код. 1) Порядок аргументов --print-to-file:
    сначала шаблон, потом файл (''--print-to-file after_move:%(filepath)s /tmp/path.txt'');
    в --print-to-file ключ after_move срабатывает после постобработки, поэтому в файл
    попадает путь к готовому файлу после склейки. 2) --print (без -to-file) включает
    тихий режим и глушит прогресс; --print-to-file тихий режим не включает — поэтому
    в коде используется только --print-to-file, а прогресс читается из stdout. 3)
    --newline печатает прогресс построчно: ''[download]  45.2% of   100.00MiB at    5.00MiB/s
    ETA 00:12'' — процент и скорость разбираются регулярным выражением, а строка ''[download]
    100% of 14.75MiB in 00:00:05 at 1.86MiB/s'' разбирается тем же шаблоном. 4) ''[download]
    Destination: <путь>'' — это путь потока, а не итоговый файл; итоговый берётся
    из after_move. 5) ''[download] <путь> has already been downloaded'' — файл уже
    есть, качать не нужно. 6) ''[info] <id>: Downloading 1 format(s): 394+251'' —
    перечисляет потоки: по числу форматов считается общий процент загрузки, а не процент
    одного потока. 7) -f принимает выражение форматов, --merge-output-format mp4 задаёт
    контейнер результата, -P задаёт каталог, -o — шаблон имени. 8) --js-runtimes <имя>
    включает JS-рантайм (deno по умолчанию, node — только с этим флагом); если рантайма
    нет, yt-dlp пишет предупреждение и продолжает. 9) Сообщения yt-dlp всегда на английском,
    локализации нет — на этом строится разбор вывода.'
  url: https://github.com/yt-dlp/yt-dlp
  version: '2026.10.26 (установлен в системе: /usr/bin/yt-dlp)'
  currency_evidence: Справка установленного бинаря (yt-dlp --help) сверена с README
    master-ветки, прочитанным в этой сессии; вывод настоящего yt-dlp на этой машине
    проверен на обычном ролике, на ссылке /shorts/ и на битой ссылке — строки разбираются
    ровно так, как описано выше.
  topics:
  - '--print-to-file: порядок аргументов и ключ after_move'
  - --print включает тихий режим, --print-to-file — нет
  - '--newline: формат строки прогресса'
  - Destination — путь потока, has already been downloaded — файл уже есть
  - Downloading N format(s) — сколько всего потоков
  - -f, --merge-output-format, -P, -o
  - '--js-runtimes: deno по умолчанию, node по флагу'
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  recorded_at: '2026-11-19T11:06:05+00:00'
- id: SRC-C2
  phase: код
  kind: api
  title: ffmpeg 9.0.2 — склейка видео и звука, которую делает yt-dlp
  findings: 'YouTube отдаёт видео и звук отдельными потоками, поэтому итоговый файл
    появляется только после склейки. Склейку выполняет ffmpeg: yt-dlp вызывает его
    сам, когда в PATH есть ffmpeg, иначе сборка потоков не происходит и остаются отдельные
    файлы. Проверено на машине владельца: ffmpeg 9.0.2 установлен (/usr/bin/ffmpeg),
    склейка mp4 проходит — файл после слияния playable. Приложение ffmpeg не вызывает
    напрямую и версию не проверяет: отсутствие ffmpeg проявится ошибкой yt-dlp, которая
    попадёт в лог.'
  url: https://ffmpeg.org/documentation.html
  version: '9.0.2 (установлен в системе: /usr/bin/ffmpeg)'
  currency_evidence: Версия взята из установленного бинаря (ffmpeg -version) в этой
    сессии; склейка mp4 проверена настоящим yt-dlp на этой машине — итоговый файл
    создан и содержит видео и звук.
  topics:
  - склейка отдельных потоков видео и звука в один mp4
  - yt-dlp вызывает ffmpeg сам, приложение — нет
  deprecated_apis: []
  applies_to:
  - package: ffmpeg
    version: 9.0.2
  recorded_at: '2026-11-19T11:06:05+00:00'
- id: SRC-C3
  phase: код
  kind: not_applicable
  title: 'Qt и PySide6 — новых API нет: интерфейс переиспользует существующие виджеты'
  findings: 'В коде фазы не появляется новой поверхности Qt: кнопка «Путь к yt-dlp»
    — это тот же QPushButton, что и кнопка «Путь к gallery-dl», диалог выбора бинарника
    — тот же choose_executable, поле ссылки и список загрузок не меняются.'
  reason: 'В коде фазы не появляется новой поверхности Qt: кнопка «Путь к yt-dlp»
    — это тот же QPushButton, что и кнопка «Путь к gallery-dl», диалог выбора бинарника
    — тот же choose_executable, поле ссылки и список загрузок не меняются. Новый API
    не изучается, изучать нечего; отдельная запись по документации Qt в этой фазе
    была бы записью без содержания.'
  recorded_at: '2026-11-19T11:06:05+00:00'
