connectivity: связные
rationale: ''
requirements:
- id: R1
  text: 'YouTube перестал отдавать видео анонимно: yt-dlp получает «Sign in to confirm
    you''re not a bot» и падает с кодом 1. Проверено на ролике владельца https://www.youtube.com/watch?v=dgKRqagdjOU:
    без cookies — проверка бота, с «--cookies-from-browser firefox:1owjllur.default-release»
    ролик извлекается (код 0, форматы 401+251, 2160p). Причина прежняя: личный инструмент
    владельца; YouTube теперь требует вход, и приложение должно уметь взять cookies
    из браузера владельца или из файла, который владелец сам экспортирует.'
  nfr: false
- id: R2
  text: 'пользователь один — владелец; cookies лежат в его браузере (Firefox с двумя
    профилями, Google Chrome, Chromium) или в файле cookies.txt, который он сам экспортирует.
    Приложение cookies не читает, не копирует и не хранит: оно только указывает yt-dlp,
    откуда их взять. Новых ролей и новых внешних систем не появляется.'
  nfr: false
- id: R3
  text: '1) в приложении есть выбор источника cookies для YouTube: не использовать
    / браузер (с точным профилем) / файл cookies.txt; 2) найденные в системе браузеры
    и профили Firefox показываются списком — владелец выбирает свой профиль, а не
    угадывает; 3) выбор запоминается и применяется к следующим загрузкам: yt-dlp получает
    «--cookies-from-browser <браузер>:<профиль>» или «--cookies <файл>»; 4) с выбранным
    источником ролик, который без cookies падал с проверкой бота, скачивается; 5)
    подсказка yt-dlp про cookies остаётся в логе и в статусе загрузки; 6) текст ошибки
    называет программу, которая качала: «yt-dlp завершился с кодом 1», а не «gallery-dl»;
    7) область лога называется «Лог» — в ней вывод обоих исполнителей; 8) поведение
    Pinterest не меняется.'
  nfr: false
  capabilities:
  - C-1
  - C-2
  - C-3
  - C-4
  - C-9
  - C-10
- id: R4
  text: '1) вход по логину и паролю приложение не запрашивает; 2) содержимое cookies
    приложение не читает и не сохраняет: в настройках лежит только имя браузера с
    профилем либо путь к файлу; 3) источник один: выбран браузер — путь к файлу очищается,
    выбран файл — браузер очищается; 4) без выбранного источника команда yt-dlp не
    содержит cookies-флагов — поведение прежнее, ролики без входа падают как раньше;
    5) выбор cookies действует только на YouTube; 6) риск блокировки аккаунта, о котором
    пишет сам yt-dlp, — решение владельца, о нём сказано в README.'
  nfr: false
- id: R5
  text: 'тесты, кроме помеченных live, в сеть не ходят; окно не подвисает, загрузка
    идёт в отдельном потоке; правила репозитория прежние: ruff с line-length 100,
    mypy --strict, не больше 300 строк на файл, аннотации типов везде; знаменатель
    обязательств остаётся 89/89; настройки cookies — не секрет, они лежат в settings.json
    рядом с путями к бинарникам.'
  nfr: true
- id: R6
  text: 'вне задачи: PO-токены, экспорт cookies средствами приложения, хранение cookies
    в keyring, вход по логину и паролю, cookies для Pinterest, авторизация других
    источников, отключение SABR-эксперимента YouTube, браузеры кроме перечисленных
    yt-dlp, изменение нормативной модели предметной области и её 89 обязательств,
    переписывание дословных цитат интервью T2, изменение истории git.'
  nfr: false
acceptance_criteria:
- id: AC1
  text: 1) в приложении есть кнопка «Cookies YouTube», в диалоге видны браузеры и
    профили Firefox, найденные в системе; 2) выбор сохраняется в настройках и после
    перезапуска остаётся; 3) с выбранным браузером команда yt-dlp содержит «--cookies-from-browser
    <браузер>:<профиль>», с файлом — «--cookies <файл>»; 4) без выбранного источника
    в команде нет cookies-флагов; 5) на ролике, который без cookies даёт «Sign in
    to confirm you're not a bot», загрузка с выбранным браузером доходит до конца;
    6) текст ошибки называет yt-dlp, а не gallery-dl; 7) область лога называется «Лог»;
    8) полный прогон тестов, типов и линтеров зелёный, знаменатель 89/89.
