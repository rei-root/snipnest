connectivity: связные
rationale: ''
requirements:
- id: R1
  text: 'Владелец проверил новый интерфейс и новый значок — всё его устраивает, и
    просит довести работу до конца: «Осталось обновить полностью установщики, что
    бы они имели новую иконку и интерфейс и пуш». То есть собранные и раздаваемые
    артефакты (установщик, образ и пакет) должны нести новый логотип и новый интерфейс,
    а изменения должны попасть в репозиторий. Прежняя версия — 0.2.2, значит новая
    — 0.2.3.'
  nfr: false
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
- id: R2
  text: 'Пользователь один — владелец, он же заказчик и он же владелец репозитория:
    он решает, какая версия выходит и что попадает в релиз. Новых ролей и внешних
    сервисов не появляется: релиз публикуется тем же конвейером CI на его же репозитории,
    доступ к которому у него уже есть.'
  nfr: false
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
- id: R3
  text: '1) Версия пакета — 0.2.3. 2) Прежней версии 0.2.2 не остаётся нигде: ни в
    коде, ни в тестах, ни в README — иначе читатель увидит две разные версии. 3) Проверка
    релиза переписана под 0.2.3: на прежней версии она падает, на новой проходит.
    4) В README имя пакета для установки — snipnest_0.2.3_amd64.deb, а имя образа
    — snipnest-0.2.3-linux-glibc-2.38-x86_64.AppImage. 5) После слияния в main отправляется
    тег v0.2.3: по нему CI собирает установщик, образ и пакет и выкладывает их в Releases.
    6) Собранные артефакты несут новый значок (logo/snipnest.svg в образе и в теме
    иконок пакета) и новый интерфейс (код задачи 014 в собранной программе), а прежних
    значка и интерфейса в них нет. 7) Ветка задачи сливается в main и отправляется
    в репозиторий: изменения, которые владелец проверил, доступны и в исходниках,
    и в раздаваемых файлах.'
  nfr: false
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
- id: R4
  text: '1) Версия меняется в одном месте — в пакете (src/snipnest/__init__.py); остальное
    вычисляется из неё. 2) Имена артефактов и адрес релиза собираются из версии пакета,
    поэтому установщик, собранный из 0.2.3, качает именно релиз 0.2.3 (v0.2.3). 3)
    Компоненты (gallery-dl, yt-dlp, yt-dlp-ejs, deno, ffmpeg) и конвейер сборки не
    трогаются: их версии закреплены отдельно и меняются отдельными задачами. 4) Иконка
    приложения — одна, векторная (logo/snipnest.svg); PNG-размеры и .DirIcon получаются
    из неё средствами Qt, внешняя программа (ImageMagick) для сборки не нужна. 5)
    Нормативная модель предметной области не меняется, 89 обязательств остаются в
    силе: релиз — это параметр окружения, а не поле модели. 6) История git не переписывается:
    релиз добавляется к ней, а не заменяет её; тег ставится на коммите main.'
  nfr: false
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
- id: R5
  text: 'тесты, кроме помеченных live, в сеть не ходят; правила репозитория прежние:
    ruff с line-length 100, mypy --strict, не больше 300 строк на файл, аннотации
    типов везде, запрещён print() в продовом коде; знаменатель обязательств остаётся
    89/89; проверка релиза работает без сети и без собранных артефактов — четвёртый
    критерий пропускается, если установщик не собран; сборка артефактов требует сети
    (переносимый Python, appimagetool и компоненты) — это делает CI, локальная сборка
    нужна для проверки.'
  nfr: true
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
- id: R6
  text: 'вне задачи: изменение интерфейса и значка (оно уже принято владельцем в задаче
    014), пересборка компонентов и изменение их версий, изменение конвейера сборки
    и имён артефактов, изменение нормативной модели предметной области, переписывание
    истории git и правка прежних тегов, публикация в сторонние каналы.'
  nfr: false
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
acceptance_criteria:
- id: AC1
  text: '1) Версия пакета — 0.2.3. 2) Прежней версии 0.2.2 нет ни в коде, ни в тестах,
    ни в README. 3) Проверка релиза проходит на новой версии и падает на прежней.
    4) Имя пакета, имя образа и адрес релиза собраны из 0.2.3, а в сведениях о сборке
    установщика лежат версия 0.2.3 и адрес v0.2.3 (если установщик собран). 5) Полный
    прогон тестов, типов и линтеров зелёный, знаменатель 89/89. 6) После слияния задачи
    в main стоит тег v0.2.3 на коммите main, а ветка задачи удалена. 7) В собранных
    артефактах новый значок: в образе — logo/snipnest.svg и .DirIcon из него, в пакете
    — иконки темы, собранные из него же; прежнего значка в артефактах нет.'
  source: tasks/015-release-0.2.3/journal.ndjson:ответы владельца
