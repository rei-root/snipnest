    version: '3'
  recorded_at: '2026-11-26T14:55:06+00:00'
- id: SRC-C1
  phase: код
  kind: api
  title: 'Qt 6 — QThread: работа в отдельном потоке через moveToThread'
  findings: 'Установщик качает образ и ставит приложение в отдельном потоке: рабочий
    объект переносится в QThread через moveToThread, а события приходят в GUI-поток
    через сигналы (queued connections) — так окно не подвисает. Поток без своего event
    loop заканчивается, когда run() вернулся, поэтому после установки поток останавливается
    явно.'
  url: https://doc.qt.io/qt-6/qthread.html
  version: Qt 6 (документация Qt; тот же API в PySide6)
  currency_evidence: 'актуальная документация Qt 6: qthread.html'
  topics:
  - 'moveToThread: перенос рабочего объекта в поток'
  - 'queued connections: сигналы между потоками безопасны'
  - поток без event loop заканчивается, когда run() вернулся
  deprecated_apis: []
  applies_to:
  - package: PySide6
    version: '6.12'
  recorded_at: '2026-11-26T14:55:07+00:00'
- id: SRC-C2
  phase: код
  kind: api
  title: 'Python 3 — subprocess: запуск программы с нужным окружением'
  findings: 'Пакетный менеджер запускается через subprocess.run с env: у polkit окружение
    пустое, поэтому работник задаёт PATH сам. Вывод программы забирается через capture_output,
    а код возврата проверяет вызывающий — так в отчёт попадает настоящая причина отказа
    пакета.'
  url: https://docs.python.org/3/library/subprocess.html
  version: Python 3.12 (документация Python 3)
  currency_evidence: 'актуальная документация Python 3: library/subprocess.html'
  topics:
  - 'subprocess.run с env: своё окружение для программы'
  - 'capture_output: вывод программы без терминала'
  - 'check=False: код возврата проверяет вызывающий'
  deprecated_apis: []
  applies_to:
  - package: python
    version: '3.12'
  recorded_at: '2026-11-26T14:55:07+00:00'
- id: SRC-C3
  phase: код
  kind: api
  title: 'PyInstaller — Run-time Information: где в бандле лежат файлы'
  findings: Внутри собранной программы файлы бандла лежат во временном каталоге, путь
    к которому даёт sys._MEIPASS (в onefile — _MEIxxxxxx). Установщик читает оттуда
    ярлык, иконку и сведения о сборке; в исходниках те же файлы берутся из packaging/
    и logo/.
  url: https://pyinstaller.org/en/stable/runtime-information.html
  version: PyInstaller 6.x (актуальная документация)
  currency_evidence: 'актуальная онлайн-документация PyInstaller: раздел Run-time
    Information'
  topics:
  - 'sys._MEIPASS: временный каталог с содержимым бандла'
  - 'sys.frozen: программа собрана, а не запущена из исходников'
  deprecated_apis: []
  applies_to:
  - package: pyinstaller
    version: '6.10'
  recorded_at: '2026-11-26T14:55:07+00:00'
