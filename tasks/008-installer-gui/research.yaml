- id: SRC-I8
  phase: интервью
  kind: api
  title: emerge — установка пакетов на Gentoo
  findings: 'Команда установки на gentoo: emerge <пакеты>. Без --ask emerge ставит
    пакеты сразу, не спрашивая — это и нужно установщику, который работает без терминала.'
  url: https://wiki.gentoo.org/wiki/Emerge
  version: Gentoo Wiki (текущая редакция)
  currency_evidence: актуальная страница wiki.gentoo.org/wiki/Emerge
  topics:
  - 'emerge ПАКЕТ: установка без запроса подтверждения'
  - '--ask: показать изменения и спросить (нам не нужно)'
  deprecated_apis: []
  applies_to:
