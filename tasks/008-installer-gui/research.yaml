entries:
- id: SRC-I1
  phase: интервью
  kind: api
  title: pkexec(1) — права администратора через polkit
  findings: 'Права администратора берутся через pkexec: пароль спрашивает polkit-агент
    системы (на KDE — свой), программа выполняется от root. Программу надо указывать
    абсолютным путём — по нему polkit выбирает действие. Окружение программы намеренно
    пустое (нет PATH, DISPLAY), поэтому работнику с правами PATH нужно задать самому.
    Коды возврата различают два отказа: 126 — человек закрыл окно, 127 — разрешения
    нет; установщик говорит о них по-разному.'
  url: https://manpages.debian.org/trixie/pkexec/pkexec.1.en.html
  version: pkexec 126-2 (trixie)
  currency_evidence: 'manpages.debian.org/trixie: pkexec.1.en.gz из pkexec 126-2,
    Source last updated 2025-01-17'
  topics:
  - pkexec PROGRAM [ARGUMENTS...] — выполнить программу от root
  - 'коды возврата: 127 — не разрешено, 126 — человек закрыл диалог'
  - окружение программы минимальное и безопасное
  - действие по умолчанию — org.freedesktop.policykit.exec
  deprecated_apis: []
  applies_to:
  - package: pkexec
    version: 126-2
  recorded_at: '2026-11-26T14:55:06+00:00'
- id: SRC-I2
  phase: интервью
  kind: api
  title: 'PyInstaller — Using Spec Files: данные внутри бандла'
  findings: 'Один spec собирает и приложение, и установщик: точка входа, имя и содержимое
    бандла задаются переменными окружения, которые читает spec (это обычный Python).
    Файлы данных (ярлык, иконка, сведения о сборке) кладутся в бандл через datas и
    в onefile-режиме распаковываются во временный каталог _MEIxxxxxx при запуске.'
  url: https://pyinstaller.org/en/stable/spec-files.html
  version: PyInstaller 6.x (актуальная документация)
  currency_evidence: 'актуальная онлайн-документация PyInstaller: раздел Using Spec
    Files'
  topics:
  - 'datas: список пар (файл, каталог внутри бандла)'
  - 'spec — исполняемый Python: в нём можно ветвиться по переменным окружения'
  - 'глобальные переменные spec: SPECPATH, DISTPATH'
  deprecated_apis: []
  applies_to:
  - package: pyinstaller
    version: '6.10'
  recorded_at: '2026-11-26T14:55:06+00:00'
- id: SRC-I3
  phase: интервью
  kind: api
  title: 'PyInstaller — Operating Mode: как работает один файл'
  findings: 'В один файл программа собирается целиком: Qt, Python и код установщика.
    При запуске загрузчик распаковывает содержимое во временный каталог и удаляет
    его при выходе — поэтому установщик стартует чуть медленнее и оставляет каталог,
    если его убили. Внутри нет ни Python в системе, ни Qt в системе: системный Python
    и Qt пользователю не нужны.'
  url: https://pyinstaller.org/en/stable/operating-mode.html
  version: PyInstaller 6.x (актуальная документация)
  currency_evidence: 'актуальная онлайн-документация PyInstaller: раздел Operating
    Mode'
  topics:
  - 'onefile: загрузчик распаковывает бандл в _MEIxxxxxx'
  - в бандле нет исходников, только скомпилированные модули
  deprecated_apis: []
  applies_to:
  - package: pyinstaller
    version: '6.10'
  recorded_at: '2026-11-26T14:55:06+00:00'
