task_id: 010-save-format
accepted_decisions:
- id: AD1
  decision: Список форматов звука остаётся прежним (MP3, M4A, Opus, FLAC, WAV); «как
    есть» не добавляем — перечень задан требованием R3.
  rationale: 'Правка не меняет требований и критериев приёмки: уточняет, когда доступен
    выбор формата и в каких вариантах видео выбирается формат звука.'
  refines: 1
