task_id: 010-save-format
entries:
- ts: '2026-11-26T17:42:32+00:00'
  scope: behavioral
  text: 'Владелец принял работу с двумя правками: 1) формат звука должен выбираться
    и в варианте «видео и звук отдельными файлами» — сейчас список звука доступен
    только для «только звук», и в режиме разделения выбрать формат аудио нельзя; звук
    в раздельных файлах должен сохраняться в выбранном формате. 2) выбор формата должен
    быть недоступен, пока в поле ссылки ничего не вставлено: сейчас список форматов
    доступен всегда, и до вставки ссылки можно выбрать формат фото. Формат выбирают
    после того, как вставили и распознали ссылку.'
