entries:
- id: SRC-I1
  phase: интервью
  kind: api
  title: yt-dlp 2026.10.26 — форматы, контейнеры, извлечение звука и скачивание потоков
    по отдельности
  findings: 'Решения по форматам держатся на контракте командной строки yt-dlp. 1)
    Формат выбирается ключом -f: выражение с «+» (bv*+ba) просит склеить видео и звук
    в один файл, выражение с запятой (bv*,ba) — скачать эти потоки отдельными файлами;
    без «+» yt-dlp ничего не склеивает, каждый выбранный формат кладётся в свой файл.
    2) Контейнер склейки задаётся --merge-output-format (поддерживаются avi, flv,
    mkv, mov, mp4, webm); для mp4 выражение берёт bv*[ext=mp4]+ba[ext=m4a], для webm
    — bv*[ext=webm]+ba[ext=webm], для mkv — bv*+ba (mkv принимает любые кодеки). 3)
    Извлечение звука: -x (--extract-audio) вместе с --audio-format mp3|m4a|opus|flac|wav|aac|vorbis|alac;
    качество перекодировки задаётся --audio-quality (0 — лучшее, 10 — худшее, по умолчанию
    5). Для -x нужен ffmpeg и ffprobe. 4) Флаг -k (--keep-video) оставляет промежуточный
    видеофайл после склейки — на диске оказывается склеенный файл плюс видео без звука,
    но не звук без видео; отдельные файлы «видео» и «звук» он не даёт. 5) Промежуточные
    файлы склейки yt-dlp удаляет сам. 6) Информационная строка «[info] <id>: Downloading
    N format(s): <ids>» сообщает, сколько форматов скачивается: при склейке N=1, а
    идентификаторы перечислены через «+» (например 394+251) — это два потока; при
    скачивании по отдельности N=2, а идентификаторы перечислены через пробел (например
    137 140). 7) Готовый файл виден по --print-to-file after_move:%(filepath)s: ключ
    after_move срабатывает после постобработки, поэтому в файле путь к итоговому файлу,
    а не к промежуточному. 8) Пресеты-алиасы подтверждают те же контракты: -t mp3
    = -f ''ba[acodec^=mp3]/ba/b'' -x --audio-format mp3, -t mp4 = --merge-output-format
    mp4 --remux-video mp4, -t mkv = --merge-output-format mkv --remux-video mkv.'
  url: https://github.com/yt-dlp/yt-dlp
  version: '2026.10.26 (установлен в системе: /usr/bin/yt-dlp, yt-dlp --version)'
  currency_evidence: Справка установленного бинаря (yt-dlp --help) сверена с README
    master-ветки, прочитанным в этой сессии (raw.githubusercontent.com/yt-dlp/yt-dlp/master/README.md,
    разделы «Video Format Options», «FORMAT SELECTION», «Preset Aliases»); исходники
    установленного пакета /usr/lib/python3/dist-packages/yt_dlp прочитаны (YoutubeDL.py,
    postprocessor/ffmpeg.py, options.py).
  topics:
  - '-f/--format: выбор потоков; «+» — склейка, «,» — скачать по отдельности'
  - '--merge-output-format: контейнер результата (avi, flv, mkv, mov, mp4, webm)'
  - '-x/--extract-audio и --audio-format: извлечение звука (best, aac, alac, flac,
    m4a, mp3, opus, vorbis, wav)'
  - '--audio-quality: качество перекодировки звука, 0 — лучшее, 10 — худшее'
  - '-k/--keep-video: оставить промежуточный видеофайл после склейки'
  - 'строка «[info] <id>: Downloading N format(s): <ids>»: сколько потоков скачивается'
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  recorded_at: '2026-11-26T16:00:01+00:00'
- id: SRC-I2
  phase: интервью
  kind: api
  title: gallery-dl 1.32.15 — формат картинки определяет сайт, перекодировки в gallery-dl
    нет
  findings: 'Перекодировку картинки gallery-dl не умеет: в его конфигурации (extractor,
    downloader, output, postprocessor) нет ни одной опции смены формата; ключ image-format
    в конфиге отсутствует, а опция --option (-o) умеет только то, что описано в option.py
    (filename, directory, archive и подобное). Pinterest-экстрактор отдаёт оригинал
    картинки (в выдаче pin поле images.orig) либо видео, если пин видео; расширение
    итогового файла — это то, что отдал сайт (jpg, png, gif, mp4). Вывод для задачи:
    формат картинки выбирает приложение, и перекодировку оно делает само — сторонней
    программой, которой у владельца может не быть. Скачанный файл gallery-dl сообщает
    в stdout построчно, уже существующий — с префиксом «# », значит перекодировку
    можно делать сразу, как только путь известен, и отдавать владельцу уже итоговое
    имя.'
  url: https://github.com/mikf/gallery-dl
  version: '1.32.15 (установлен в системе: /usr/local/bin/gallery-dl, gallery-dl --version)'
  currency_evidence: 'Проверено на установленном бинаре в этой сессии: gallery-dl
    --version печатает 1.32.15; исходники установленного пакета /usr/lib/python3/dist-packages/gallery_dl
    прочитаны (config.py, option.py, extractor/pinterest.py).'
  topics:
  - 'в gallery-dl нет ни одной опции перекодировки картинки: конфиг состоит только
    из extractor/downloader/output/postprocessor'
  - Pinterest отдаёт оригинал картинки (images.orig) или видео — расширение файла
    задаёт сайт
  - путь скачанного файла gallery-dl печатает в stdout, уже существующий — с префиксом
    «# »
  deprecated_apis: []
  applies_to:
  - package: gallery-dl
    version: 1.32.15
  recorded_at: '2026-11-26T16:00:01+00:00'
- id: SRC-I3
  phase: интервью
  kind: capabilities
  title: Возможности выбора формата сохранения, найденные для задачи, и решения по
    ним
  findings: 'Запрос владельца сводится к одному выбору перед загрузкой, и он разветвляется
    по типу ссылки: картинка или видео. По каждой найденной возможности принято решение
    — нужно, не нужно или отложено — с причиной. Четыре возможности выбраны в работу,
    остальные отклонены с обоснованием: перекодировка картинок сторонней программой
    отпадает, потому что она может быть не установлена, а Qt в приложении уже есть;
    выбор качества видео и перекодировка кодеков отпадают, потому что владелец просил
    формат, а не качество, и перекодировка видео долгая и теряет качество; анимированный
    GIF перекодировке не подлежит, иначе от картинки останется один кадр.'
  url: https://github.com/yt-dlp/yt-dlp
  version: 2026.10.26 (yt-dlp) и 1.32.15 (gallery-dl) — установленные в системе версии
  currency_evidence: Решения опираются на две свежие редакции документации, прочитанные
    в этой сессии (README yt-dlp master-ветки и справка установленного бинаря), и
    на исходники установленных пакетов yt_dlp и gallery_dl, прочитанные на этой машине;
    поведение Qt проверено запуском на установленном PySide6 6.12.0.
  topics:
  - 'выбор формата картинки: JPEG, PNG, WebP или «как скачано»'
  - перекодировка картинки средствами Qt (QImage) вместо внешней программы
  - 'выбор контейнера видео: MP4, WebM, MKV'
  - извлечение звука из видео в отдельный аудиофайл
  - разделение видео и звука на два отдельных файла
  - выбор применяется к загрузке, до её старта, и помнится между запусками
  - выбор разрешения и качества видео
  - перекодировка видеокодеков
  - перекодировка анимированного GIF
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  - package: gallery-dl
    version: 1.32.15
  capabilities:
  - id: C-1
    name: 'Выбор формата картинки перед загрузкой: «как скачано», JPEG, PNG, WebP'
    decision: нужно
    rationale: 'Прямой запрос владельца: «При загрузке фото он предлагает выбор из
      форматов в которых может хранится фото». Без выбора картинка всегда сохраняется
      в том виде, в каком её отдал сайт, и привести её к webp или jpeg без сторонних工具
      нельзя.'
  - id: C-2
    name: Перекодировку картинки делает приложение средствами Qt (QImage), без внешней
      программы
    decision: нужно
    rationale: 'gallery-dl перекодировать не умеет (SRC-I2), а ffmpeg у владельца
      может не стоять: мастер установки его ставит, но заставить им перекодировать
      картинки — лишняя зависимость. Qt в приложении есть всегда и умеет писать jpg,
      png и webp (проверено на установленном PySide6 6.12.0).'
  - id: C-3
    name: Вариант «как скачано» — картинка сохраняется без перекодировки
    decision: нужно
    rationale: 'Перекодировка без просьбы владельца теряет качество и место, поэтому
      умолчание остаётся прежним: файл сохраняется в исходном формате. Вариант виден
      в списке явно, чтобы владелец сам выбрал перекодировку.'
  - id: C-4
    name: 'Выбор контейнера видео: MP4, WebM, MKV'
    decision: нужно
    rationale: 'Прямой запрос владельца: «для видео он предлагает форматы видео».
      Контейнер выбирается выражением -f и --merge-output-format, перекодировки при
      этом нет: MP4 берёт H.264 с AAC, WebM — VP9 с Opus, MKV — любые доступные кодеки.'
  - id: C-5
    name: Извлечение звука из видео и сохранение его отдельным аудиофайлом (MP3, M4A,
      Opus, FLAC, WAV)
    decision: нужно
    rationale: 'Прямой запрос владельца: «либо извлечь из видео аудио и сохранить
      как аудио». Это делает yt-dlp ключами -x и --audio-format; нужен ffmpeg, который
      приложение и так ставит и передаёт через --ffmpeg-location.'
  - id: C-6
    name: Разделение видео и звука на два отдельных файла
    decision: нужно
    rationale: 'Прямой запрос владельца: «а так же можно разделить и видео и аудио
      отдельными файлами». Ключ -k оставляет промежуточный видеофайл, но звука без
      видео не даёт, поэтому видеопоток и звуковой поток скачиваются двумя запусками
      yt-dlp с разными именами файла.'
  - id: C-7
    name: Выбор формата действует на ту загрузку, для которой сделан, и делается до
      её старта
    decision: нужно
    rationale: 'Формат — такой же параметр запуска, как папка сохранения: он определяет,
      что именно окажется на диске, и после старта загрузки меняться не может.'
  - id: C-8
    name: Последний выбор формата помнится между запусками приложения отдельно для
      картинок и для видео
    decision: нужно
    rationale: Владелец чаще всего качает одно и то же; повторный выбор при каждой
      загрузке — лишнее действие. Помнится выбор по каждому виду ссылки, чтобы переключение
      «фото — видео» не сбрасывало его.
  - id: C-9
    name: Перекодировка картинки сторонней программой (ffmpeg)
    decision: не_нужно
    rationale: ffmpeg может отсутствовать, а перекодировка картинок — не его работа;
      Qt умеет то же самое и есть в приложении всегда (см. C-2).
  - id: C-10
    name: Выбор разрешения и качества видео (720p, 1080p, 4K)
    decision: не_нужно
    rationale: Владелец просил выбрать формат, а не качество; качество остаётся прежним
      — лучшее доступное с предпочтением mp4. Ручной выбор качества прямо назван вне
      задачи в требованиях задачи 003.
  - id: C-11
    name: Перекодировка видео в другой кодек (H.265, AV1)
    decision: не_нужно
    rationale: Это долгая перекодировка с потерей качества и места; выбор контейнера
      (C-4) закрывает запрос владельца.
  - id: C-12
    name: Анимированный GIF перекодируется в неподвижную картинку
    decision: не_нужно
    rationale: От анимированного GIF останется один кадр, и владелец потеряет анимацию,
      не спрашивая об этом. GIF остаётся GIF.
  - id: C-13
    name: Формат картинки выбирается один раз для всего альбома
    decision: нужно
    rationale: Альбом — одна загрузка, и файлы в ней однородны; отдельный выбор на
      каждый файл означал бы, что загрузка неоднородна по смыслу.
  recorded_at: '2026-11-26T16:00:01+00:00'
- id: SRC-I4
  phase: код
  kind: api
  title: 'Контракт, на который опирается код: yt-dlp, gallery-dl и Qt'
  findings: 'Что именно код делает с этими контрактами. 1) Команда yt-dlp собирается
    по шаблону: [бинарь, --newline, --no-playlist, --js-runtimes, --ffmpeg-location,
    --paths, cookies, -f <выражение>, --merge-output-format <контейнер>|-x --audio-format
    <формат> --audio-quality 0, -o <шаблон имени>, --print-to-file after_move:%(filepath)s
    <файл>, <ссылка>]. Выражение -f и контейнер --merge-output-format меняются по
    выбору владельца; для «только звука» вместо склейки идут -x --audio-format <формат>
    --audio-quality 0; для раздельных файлов делаются два запуска с разными шаблонами
    имени. 2) Число скачиваемых потоков берётся из строки «[info] <id>: Downloading
    N format(s): <ids>»: при склейке идентификаторы перечислены через «+» (394+251
    — это два потока), при раздельном скачивании — через пробел (137 140 — это два
    формата), поэтому счётчик потоков считается по «+», а при его отсутствии берётся
    само N. 3) Путь к готовому файлу yt-dlp пишет через --print-to-file after_move:%(filepath)s:
    ключ срабатывает после постобработки, поэтому в файле лежит уже итоговое имя (например
    «Название [id].mp4» после склейки). 4) gallery-dl печатает в stdout путь каждого
    скачанного файла построчно, уже существующий — с префиксом «# », и делает это
    сразу после того, как файл дописан: значит перекодировку можно делать в момент,
    когда путь известен, и отдавать владельцу уже итоговое имя. 5) Qt: QImage читает
    файл по пути, QImage.save(path, «JPEG»|«PNG»|«WEBP», quality) пишет его в нужный
    формат; для JPEG и WebP качество задаётся числом (в коде — 90), PNG пишется без
    потерь; прозрачность при записи в JPEG теряется, поэтому картинка сначала переводится
    в RGB на белом фоне. 6) Плагины форматов изображений (imageformats: qjpeg, qpng,
    qwebp) лежат в составе PySide6 и попадают в сборку PyInstaller штатным хуком PySide6.QtGui,
    поэтому конвертация работает и в собранном приложении.'
  url: https://github.com/yt-dlp/yt-dlp
  version: yt-dlp 2026.10.26, gallery-dl 1.32.15, PySide6 6.12.0 — установленные в
    системе версии
  currency_evidence: 'Все три контракта сверены с установленными в системе пакетами
    в этой сессии: yt-dlp (YoutubeDL.py, options.py, postprocessor/ffmpeg.py), gallery-dl
    (option.py, extractor/pinterest.py) и PySide6 6.12.0, где запись и чтение jpg/png/webp
    проверены запуском. Документация Qt недоступна по сети (doc.qt.io отвечает 403),
    поэтому контракт QImage подтверждён установленным пакетом и запуском, а не пересказом.'
  topics:
  - -f, --merge-output-format, -x, --audio-format, --audio-quality, --print-to-file
    after_move
  - 'stdout gallery-dl: путь скачанного файла, «# » — уже существующий'
  - 'QImage: чтение картинки, запись в jpg/png/webp, качество JPEG и WebP'
  - плагины imageformats в составе PySide6 и в сборке PyInstaller
  deprecated_apis: []
  applies_to:
  - package: yt-dlp
    version: 2026.10.26
  - package: gallery-dl
    version: 1.32.15
  - package: PySide6
    version: 6.12.0
  recorded_at: '2026-11-26T16:00:01+00:00'
- id: SRC-I5
