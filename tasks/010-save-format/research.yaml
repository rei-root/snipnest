  url: https://github.com/yt-dlp/yt-dlp
  version: 2026.10.26 (yt-dlp) и 1.32.15 (gallery-dl) — установленные в системе версии
  currency_evidence: 'Запись повторяет SRC-I3 с исправленной формулировкой: в тексте
    SRC-I3 слова «без сторонних инструментов» набраны посторонними иероглифами. Содержание
    решений не менялось, основания прежние: README yt-dlp master-ветки и справка установленного
