requirements:
- id: R1
  text: 'Владелец хочет выбирать, в каком виде останутся на диске картинки и видео.
    Запрос дословно: «Необходимо в саму утилиту (не установщики) добавить возможность
    выбирать формат в котором сохранять изображение/видео. При загрузке фото он предлагает
    выбор из форматов в которых может хранится фото, для видео он предлагает форматы
    видео, либо извлечь из видео аудио и сохранить как аудио, а так же можно разделить
    и видео и аудио отдельными файлами». Причина прежняя: личный инструмент без терминала,
    пользователь один — сам владелец. Он смотрит ролики и картинки и хочет оставить
    их у себя в удобном виде — картинку привести к webp, из ролика вытащить звук,
    а большой ролик разобрать на видео и звук, — не собирая это руками в конвертере.
    Ключевое слово запроса — «в саму утилиту»: выбор формата живёт в приложении, мастер
    установки компонентов его не касается.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-cZkhQ4/interview.yaml
  capabilities:
  - C-1
  - C-4
  - C-5
  - C-6
- id: R2
  text: 'Пользователь один — владелец, приложение запускается на его личной машине
    в графическом сеансе KDE. Новых ролей не появляется: выбор формата — это параметр
    загрузки, а не новый пользователь и не новый внешний сервис, с которым договаривается
    человек. Владелец сам и есть заказчик функции.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-cZkhQ4/interview.yaml
- id: R3
  text: '1) Перед стартом загрузки приложение предлагает выбор формата, и вид выбора
    зависит от ссылки: для картинки Pinterest — «как скачано», JPEG, PNG, WebP; для
    видео YouTube — MP4 (видео со звуком), WebM (видео со звуком), MKV (видео со звуком),
    «только звук» и «видео и звук отдельными файлами»; для «только звука» — формат
    звука: MP3, M4A, Opus, FLAC, WAV. 2) Выбор действует на ту загрузку, для которой
    сделан: в альбоме все картинки сохраняются в выбранном формате, отдельного выбора
    на каждый файл нет. 3) Картинка в выбранном формате сохраняется в выбранную папку
    и заменяет исходный файл: в папке остаётся один файл в выбранном формате, а не
    два. 4) Картинка, сохранённая «как скачано», остаётся в том формате, в каком её
    отдал сайт, и размер файла не меняется. 5) Контейнер видео выбирается на стороне
    yt-dlp без перекодировки: MP4 берёт H.264 с AAC, WebM — VP9 с Opus, MKV — любые
    доступные кодеки. 6) «Только звук»: из ролика остаётся один аудиофайл выбранного
    формата, видео в папке нет. 7) «Видео и звук отдельными файлами»: в папке два
    файла — видео без звука и звук без видео, с именами «Название [id] (видео).ext»
    и «Название [id] (звук).ext»; склейки при этом нет. 8) Последний сделанный выбор
    помнится между запусками приложения отдельно для картинок и для видео, и следующий
    раз список открывается на нём. 9) Всё прочее поведение загрузки не меняется: то
    же поле ссылки, та же папка сохранения, тот же список загрузок, тот же итог «скачано
    / пропущено / ошибок», тот же прогресс и скорость.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-cZkhQ4/interview.yaml
  capabilities:
  - C-1
  - C-3
  - C-4
  - C-5
  - C-6
  - C-7
  - C-8
  - C-13
- id: R4
  text: '1) Умолчания прежние: картинка — «как скачано», видео — MP4 со звуком; выбор
    формата добавлен к приложению, а не вместо прежнего поведения. 2) Картинку перекодирует
    само приложение средствами Qt (QImage): сторонние программы для этого не нужны,
    потому что их у владельца может не быть; JPEG и WebP пишутся с качеством 90, PNG
    — без потерь, прозрачность при записи в JPEG заливается белым. 3) Анимированный
    GIF не перекодируется и остаётся GIF: перекодировка оставила бы от него один кадр.
    4) Перекодируются только неподвижные картинки (jpg, jpeg, png, webp, bmp, tiff);
    файлы, которые не картинки (видео с Pinterest), не трогаются. 5) Извлечение звука
    и склейка видео со звуком требуют ffmpeg: приложение передаёт его через --ffmpeg-location,
    как и раньше; если ffmpeg нет, ошибка yt-dlp попадает в лог и загрузка переходит
    в состояние «ошибка». 6) При раздельных файлах имена различаются словами «(видео)»
    и «(звук)»: расширения видеопотока и звукового потока могут совпасть, а совпавшие
    имена перезаписали бы друг друга. 7) Выбор формата — параметр запуска загрузки,
    а не новый актёр, не новое состояние и не новое поле нормативной модели; модель
    предметной области не меняется, 89 обязательств остаются в силе. 8) Загрузка,
    перекодировка картинок и скачивание раздельных потоков идут в рабочем потоке:
    окно не подвисает.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-cZkhQ4/interview.yaml
  capabilities:
  - C-2
  - C-3
  - C-7
  - C-8
- id: R5
  text: 'загрузка и перекодировка идут в отдельном потоке, окно не подвисает; тесты,
    кроме помеченных live, в сеть не ходят и не требуют внешних программ, кроме установленных
    gallery-dl и yt-dlp; правила репозитория прежние: ruff с line-length 100, mypy
    --strict, не больше 300 строк на файл, аннотации типов везде, запрещён print()
    в продовом коде; знаменатель обязательств остаётся 89/89; перекодировка картинок
    делается без Pillow — его нет в зависимостях проекта и он исключён из сборки.'
  nfr: true
  source: /tmp/delta-scratch-.delta-fs-cZkhQ4/interview.yaml
- id: R6
  text: 'вне задачи: выбор разрешения и качества видео, перекодировка видео в другие
    кодеки, скачивание субтитров и обложек, плейлисты, авторизация по логину и паролю,
    другие источники кроме Pinterest и YouTube, поиск по ключевым словам, планировщик,
    мастер установки компонентов (выбор формата живёт в утилите, а не в установщике),
    сборка в один файл, изменение нормативной модели предметной области и её 89 обязательств,
    переписывание дословных цитат интервью T2, изменение истории git.'
  nfr: false
  source: /tmp/delta-scratch-.delta-fs-cZkhQ4/interview.yaml
acceptance_criteria:
- id: AC1
  text: '1) Ссылка на картинку Pinterest распознаётся, и рядом с полем ссылки появляется
    выбор формата картинки со списком «как скачано», JPEG, PNG, WebP; при выборе JPEG
    в выбранной папке лежит ровно один файл с расширением .jpg, картинка в нём открывается
    и размеры совпадают с исходными, а файла в исходном расширении рядом нет. 2) При
    выборе «как скачано» файл сохраняется в расширении, в каком его отдал сайт, и
    побайтово совпадает с тем, что отдал сайт. 3) Ссылка на видео YouTube распознаётся,
    и предлагаются MP4, WebM, MKV, «только звук» и «видео и звук отдельными файлами»,
    а для «только звука» — список форматов звука. 4) При «только звук» (MP3) в выбранной
    папке лежит один файл .mp3 и нет ни одного видеофайла. 5) При «видео и звук отдельными
    файлами» в выбранной папке лежат два файла: «Название [id] (видео).ext» без звука
    и «Название [id] (звук).ext» без видео, склеенного файла нет. 6) Выбор, сделанный
    для картинок, и выбор, сделанный для видео, помнятся: после перезапуска приложения
    списки открываются на них. 7) Поведение по умолчанию прежнее: картинка сохраняется
    как скачана, видео — MP4 со звуком; полный прогон тестов, типов и линтеров зелёный,
    знаменатель 89/89.'
