task_id: 001-pinterest-gui-wrapper
accepted_decisions:
- id: AD1
  decision: 'Раскладку внутри выбранной папки задаёт приложение: шаблон каталога gallery-dl
    пустой для картинки (файл прямо в выбранной папке) и «{board[name]:?//}» для альбома
    (одна папка с названием доски, которое берёт gallery-dl из данных Pinterest).
    Картинка отличается от альбома по числу файлов предварительного прохода: один
    файл — картинка, несколько — альбом.'
  rationale: 'Пользователь привёл два конкретных случая: лишняя папка «pinterest»
    в выбранной папке и дерево «pinterest/formaruslan59/Персонажи аниме» вместо одной
    папки с названием альбома. gallery-dl 1.32.15 умеет это через глобальную опцию
    directory (список шаблонов; path.py) и формат с модификатором «?//» (formatter.py).
    Имена файлов не меняем — их определяет gallery-dl.'
  refines: 1
