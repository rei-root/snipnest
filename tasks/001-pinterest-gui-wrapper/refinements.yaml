task_id: 001-pinterest-gui-wrapper
entries:
- ts: '2026-11-18T15:19:37+00:00'
  scope: behavioral
  text: 'Правка после приёмки. Выбранная папка сохранения — это конечная точка, а
    не база для дерева каталогов: 1) файл картинки кладётся прямо в выбранную папку,
    без своей подпапки (например, «pinterest»); 2) при загрузке альбома создаётся
    ровно одна папка с названием альбома, и файлы альбома лежат в ней, а не в дереве
    «pinterest/<владелец>/<альбом>». Имена файлов по-прежнему определяет gallery-dl.'
