  - id: FACT-080
    slot: rights[ba,править,правки]
    value: n/a
    source: derived
    rationale: 'UC-3 A3: BA возвращается в цикл только по инициативе оркестратора (TR-016). Сам BA в фазу правок не входит.'
    derives_from:
      - graph
  - id: FACT-081
    slot: rights[ba,править,готово]
    value: n/a
    source: derived
    rationale: BA не действует после «готово».
    derives_from:
      - graph
  - id: FACT-082
    slot: rights[оркестратор,править,получена]
    value: n/a
