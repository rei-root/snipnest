  - id: FACT-071
    slot: rights[человек,править,код]
    value: n/a
    source: derived
    rationale: 'BR-1: человек между интервью и правками не действует. В графе нет исходящих дуг человека из этого состояния.'
    derives_from:
      - graph
  - id: FACT-072
    slot: rights[человек,править,арбитраж]
    value: n/a
    source: derived
    rationale: 'BR-1 и T4: «без привлечения человека». В графе нет исходящих дуг человека из этого состояния.'
    derives_from:
      - graph
  - id: FACT-073
    slot: rights[человек,править,финальная_проверка]
    value: n/a
    source: derived
    rationale: 'BR-1: человек между интервью и правками не действует.'
    derives_from:
      - graph
  - id: FACT-074
    slot: rights[ba,править,отклонена_ba]
    value: n/a
    source: derived
    rationale: терминальное состояние; BA явно отказался.
    derives_from:
