facts:
  - id: FACT-001
    slot: reversible[отменить]
    value: "no"
    source: assumed
    rationale: 'отмена по определению финальна: для восстановления нужен новый прогон, а не откат действия. В источнике (T1–T7) сценарий ''отменили, потом вернули'' не описан ни разу.'
  - id: FACT-002
    slot: reversible[править]
    value: "yes"
    source: assumed
    rationale: в графе TR-008 (код → код, event код_готов, guard 'есть непрошедший тест') и в BRD §FR-9 ('правки откатывают цикл к спеке целиком') правка моделируется как возврат к предыдущему состоянию, что предполагает её обратимость в рамках цикла.
  - id: FACT-003
    slot: rights[человек,отменить,получена]
    value: n/a
    source: assumed
    rationale: в T1–T7 нет фразы, описывающей отмену задачи человеком. BR-1 ограничивает участие человека интервью и правками — о действии «отменить» ни слова.
  - id: FACT-004
    slot: rights[человек,отменить,интервью]
    value: n/a
    source: assumed
    rationale: 'см. права[человек,отменить,получена]: в источнике нет отмены.'
  - id: FACT-005
    slot: rights[человек,отменить,отклонена_ba]
    value: n/a
    source: assumed
    rationale: 'терминальное состояние: задача уже снята с потока, отменять нечего.'
  - id: FACT-006
    slot: rights[человек,отменить,спецификация]
    value: n/a
    source: assumed
    rationale: 'BR-1: человек между интервью и правками не действует. Отмены в источнике нет.'
  - id: FACT-007
    slot: rights[человек,отменить,тесты]
    value: n/a
    source: assumed
    rationale: 'BR-1: человек между интервью и правками не действует.'
  - id: FACT-008
    slot: rights[человек,отменить,код]
    value: n/a
    source: assumed
    rationale: 'BR-1: человек между интервью и правками не действует.'
  - id: FACT-009
    slot: rights[человек,отменить,арбитраж]
    value: n/a
    source: assumed
    rationale: 'BR-1: человек между интервью и правками не действует; T4 явно говорит «без привлечения человека».'
  - id: FACT-010
    slot: rights[человек,отменить,финальная_проверка]
    value: n/a
    source: assumed
    rationale: 'BR-1: человек между интервью и правками не действует.'
  - id: FACT-011
    slot: rights[человек,отменить,правки]
    value: n/a
    source: assumed
    rationale: в источнике отмены нет; правки — это запуск нового цикла, а не отмена старого.
  - id: FACT-012
    slot: rights[человек,отменить,готово]
    value: n/a
    source: assumed
    rationale: отмены в источнике нет; задача уже в «готово», дальше либо правки, либо тишина.
  - id: FACT-013
    slot: rights[ba,отменить,получена]
    value: n/a
    source: assumed
    rationale: в источнике отмены нет; BA роль структурно — взять и провести интервью.
  - id: FACT-014
    slot: rights[ba,отменить,интервью]
    value: n/a
    source: assumed
    rationale: BA может передать оркестратору (TR-003) или отклонить как несвязную (TR-004). Это иные действия, не отмена.
  - id: FACT-015
    slot: rights[ba,отменить,отклонена_ba]
    value: n/a
    source: assumed
    rationale: терминальное состояние.
  - id: FACT-016
    slot: rights[ba,отменить,спецификация]
    value: n/a
    source: assumed
    rationale: BA после передачи не действует в этих фазах; отмены в источнике нет.
  - id: FACT-017
    slot: rights[ba,отменить,тесты]
    value: n/a
    source: assumed
    rationale: BA не действует в фазе тестов; отмены в источнике нет.
  - id: FACT-018
    slot: rights[ba,отменить,код]
    value: n/a
    source: assumed
    rationale: BA не действует в фазе кода; отмены в источнике нет.
  - id: FACT-019
    slot: rights[ba,отменить,арбитраж]
    value: n/a
    source: assumed
    rationale: BA не действует в арбитраже; отмены в источнике нет.
  - id: FACT-020
    slot: rights[ba,отменить,финальная_проверка]
    value: n/a
    source: assumed
    rationale: BA не действует в финальной проверке; отмены в источнике нет.
  - id: FACT-021
    slot: rights[ba,отменить,правки]
    value: n/a
    source: assumed
    rationale: BA не возвращается в цикл правок; в UC-3 A3 BA возвращается только по инициативе оркестратора.
  - id: FACT-022
    slot: rights[ba,отменить,готово]
    value: n/a
    source: assumed
    rationale: BA не действует после «готово»; отмены в источнике нет.
  - id: FACT-023
    slot: rights[оркестратор,отменить,получена]
    value: n/a
    source: assumed
    rationale: задача только поступила, активных фаз нет; отмены в источнике нет.
  - id: FACT-024
    slot: rights[оркестратор,отменить,интервью]
    value: n/a
    source: assumed
    rationale: оркестратор в интервью не действует; отмены в источнике нет.
  - id: FACT-025
    slot: rights[оркестратор,отменить,отклонена_ba]
    value: n/a
    source: assumed
    rationale: терминальное состояние.
  - id: FACT-026
    slot: rights[оркестратор,отменить,спецификация]
    value: n/a
    source: assumed
    rationale: оркестратор сам формирует спеку; отменить собственную работу — структурно не предусмотрено.
  - id: FACT-027
    slot: rights[оркестратор,отменить,тесты]
    value: n/a
    source: assumed
    rationale: отмены в источнике нет; оркестратор передаёт тестописателю, не отменяет.
  - id: FACT-028
    slot: rights[оркестратор,отменить,код]
    value: n/a
    source: assumed
    rationale: оркестратор арбитрит споры кодера, но не отменяет задачу.
  - id: FACT-029
    slot: rights[оркестратор,отменить,арбитраж]
    value: n/a
    source: assumed
    rationale: оркестратор выносит решение по тесту; отменить задачу здесь — выход за рамки регламента арбитража (FR-7).
  - id: FACT-030
    slot: rights[оркестратор,отменить,финальная_проверка]
    value: n/a
    source: assumed
    rationale: на финальной проверке оркестратор либо объявляет «готово», либо возвращает в код (TR-013). Отменить — не вариант.
  - id: FACT-031
    slot: rights[оркестратор,отменить,правки]
    value: n/a
    source: assumed
    rationale: правки перезапускают цикл, не отменяют его.
  - id: FACT-032
    slot: rights[оркестратор,отменить,готово]
    value: n/a
    source: assumed
    rationale: после «готово» оркестратор ждёт либо правок, либо завершения; отмены нет.
  - id: FACT-033
    slot: rights[тестописатель,отменить,получена]
    value: n/a
    source: assumed
    rationale: тестописатель не действует до своей фазы; отмены в источнике нет.
  - id: FACT-034
    slot: rights[тестописатель,отменить,интервью]
    value: n/a
    source: assumed
    rationale: тестописатель не действует в интервью; отмены нет.
  - id: FACT-035
    slot: rights[тестописатель,отменить,отклонена_ba]
    value: n/a
    source: assumed
    rationale: терминальное состояние.
  - id: FACT-036
    slot: rights[тестописатель,отменить,спецификация]
    value: n/a
    source: assumed
    rationale: тестописатель ещё не приступил; отмены в источнике нет.
  - id: FACT-037
    slot: rights[тестописатель,отменить,тесты]
    value: n/a
    source: assumed
    rationale: тестописатель пишет тесты; отменить собственную работу — за рамками описанного потока.
  - id: FACT-038
    slot: rights[тестописатель,отменить,код]
    value: n/a
    source: assumed
    rationale: тестописатель после сдачи тестов не действует; отмены в источнике нет.
  - id: FACT-039
    slot: rights[тестописатель,отменить,арбитраж]
    value: n/a
    source: assumed
    rationale: 'тестописатель не действует в арбитраже (T4: решение выносит оркестратор); отмены в источнике нет.'
  - id: FACT-040
    slot: rights[тестописатель,отменить,финальная_проверка]
    value: n/a
    source: assumed
    rationale: тестописатель не действует в финальной проверке; отмены нет.
  - id: FACT-041
    slot: rights[тестописатель,отменить,правки]
    value: n/a
    source: assumed
    rationale: тестописатель обновляет тесты по правкам (UC-3 §5), не отменяет задачу.
  - id: FACT-042
    slot: rights[тестописатель,отменить,готово]
    value: n/a
    source: assumed
    rationale: тестописатель не действует в «готово»; отмены в источнике нет.
  - id: FACT-043
    slot: rights[кодер,отменить,получена]
    value: n/a
    source: assumed
    rationale: кодер не действует до своей фазы; отмены в источнике нет.
  - id: FACT-044
    slot: rights[кодер,отменить,интервью]
    value: n/a
    source: assumed
    rationale: кодер не действует в интервью; отмены нет.
  - id: FACT-045
    slot: rights[кодер,отменить,отклонена_ba]
    value: n/a
    source: assumed
    rationale: терминальное состояние.
  - id: FACT-046
    slot: rights[кодер,отменить,спецификация]
    value: n/a
    source: assumed
    rationale: кодер ещё не приступил; отмены в источнике нет.
  - id: FACT-047
    slot: rights[кодер,отменить,тесты]
    value: n/a
    source: assumed
    rationale: кодер не действует в фазе тестов; отмены нет.
  - id: FACT-048
    slot: rights[кодер,отменить,код]
    value: n/a
    source: assumed
    rationale: 'кодер не отменяет задачу: либо правит код, либо оспаривает тест (UC-2 §Триггер).'
  - id: FACT-049
    slot: rights[кодер,отменить,арбитраж]
    value: n/a
    source: assumed
    rationale: кодер инициирует арбитраж оспариванием теста; отменить задачу отсюда — за рамками UC-2.
  - id: FACT-050
    slot: rights[кодер,отменить,финальная_проверка]
    value: n/a
    source: assumed
    rationale: кодер не действует в финальной проверке; отмены нет.
  - id: FACT-051
    slot: rights[кодер,отменить,правки]
    value: n/a
    source: assumed
    rationale: кодер обновляет код по правкам (UC-3 §6), не отменяет задачу.
  - id: FACT-052
    slot: rights[кодер,отменить,готово]
    value: n/a
    source: assumed
    rationale: кодер не действует в «готово»; отмены в источнике нет.
  - id: FACT-053
    slot: rights[человек,править,правки]
    value: allow
    source: derived
    rationale: test
    derives_from:
      - TR-015
  - id: FACT-054
    slot: rights[человек,править,правки]
    value: allow
    source: derived
    rationale: 'TR-027 (event человек_уточнил_правки initiator: человек action: править) — человек уточняет правки в фазе правок перед их подачей.'
    supersedes: FACT-053
    reason: FACT-053 был пробным с derives_from TR-015, у TR-015 нет action=править. Добавил TR-027 и привязал к нему.
    derives_from:
      - TR-027
  - id: FACT-055
    slot: rights[человек,править,получена]
    value: allow
    source: derived
    rationale: 'TR-019 (event человек_уточнил_задачу initiator: человек action: править) — человек правит задачу до того, как BA её взял.'
    derives_from:
      - TR-019
  - id: FACT-056
    slot: rights[человек,править,интервью]
    value: allow
    source: derived
    rationale: 'TR-018 (event человек_дал_уточнение initiator: человек action: править) — человек отвечает на вопросы BA и правит требования во время интервью.'
    derives_from:
      - TR-018
  - id: FACT-057
    slot: rights[человек,править,готово]
    value: allow
    source: derived
    rationale: 'TR-014 (event человек_дал_правки initiator: человек action: править) — человек инициирует цикл правок из состояния «готово».'
    derives_from:
      - TR-014
  - id: FACT-058
    slot: rights[ba,править,получена]
    value: allow
    source: derived
    rationale: 'TR-002 (event ba_взялся initiator: ba action: править) — ba берёт задачу и переводит её в интервью.'
    derives_from:
      - TR-002
  - id: FACT-059
    slot: rights[ba,править,интервью]
    value: allow
    source: derived
    rationale: 'TR-017 (event ba_уточнил_требования initiator: ba action: править) — ba уточняет требования во время интервью; T3:38 «BA уточняет до тех пор, пока вся необходимая информация не будет получена».'
    derives_from:
      - TR-017
  - id: FACT-060
    slot: rights[оркестратор,править,спецификация]
    value: allow
    source: derived
    rationale: 'TR-020 (event оркестратор_уточнил_спеку initiator: оркестратор action: править) — оркестратор правит спеку в фазе спецификации (T2 FR-3).'
    derives_from:
      - TR-020
  - id: FACT-061
    slot: rights[оркестратор,править,арбитраж]
    value: allow
    source: derived
    rationale: 'TR-021 (event оркестратор_уточнил_решение initiator: оркестратор action: править) — оркестратор выносит решение в арбитраже (T4 основной поток).'
    derives_from:
      - TR-021
  - id: FACT-062
    slot: rights[оркестратор,править,финальная_проверка]
    value: allow
    source: derived
    rationale: 'TR-022 (event оркестратор_перепроверил initiator: оркестратор action: править) — оркестратор проходит три слоя проверки (T2 FR-8).'
    derives_from:
      - TR-022
  - id: FACT-063
    slot: rights[оркестратор,править,правки]
    value: allow
    source: derived
    rationale: 'TR-023 (event оркестратор_уточнил_правки initiator: оркестратор action: править) — оркестратор уточняет правки в фазе правок; BR-4 «принятые решения» фиксируются здесь же.'
    derives_from:
      - TR-023
  - id: FACT-064
    slot: rights[тестописатель,править,тесты]
    value: allow
    source: derived
    rationale: 'TR-024 (event тестописатель_дописал_тесты initiator: тестописатель action: править) — тестописатель пишет unit→integration→e2e последовательно (T2 FR-4).'
    derives_from:
      - TR-024
  - id: FACT-065
    slot: rights[тестописатель,править,правки]
    value: allow
    source: derived
    rationale: 'TR-025 (event тестописатель_обновил_тесты initiator: тестописатель action: править) — тестописатель обновляет тесты в фазе правок (UC-3 §5).'
    derives_from:
      - TR-025
  - id: FACT-066
    slot: rights[кодер,править,код]
    value: allow
    source: derived
    rationale: 'TR-008 (event код_готов guard «есть непрошедший тест» → код → код) и TR-009 (код → арбитраж, action: править) — кодер пишет и правит код в фазе «код».'
    derives_from:
      - TR-008
      - TR-009
  - id: FACT-067
    slot: rights[кодер,править,правки]
    value: allow
    source: derived
    rationale: 'TR-026 (event кодер_обновил_код initiator: кодер action: править) — кодер обновляет код в фазе правок (UC-3 §6).'
    derives_from:
      - TR-026
  - id: FACT-068
    slot: rights[человек,править,отклонена_ba]
    value: n/a
    source: derived
    rationale: 'терминальное состояние: BA явно отказался, задача снята.'
    derives_from:
      - graph
  - id: FACT-069
    slot: rights[человек,править,спецификация]
    value: n/a
    source: derived
    rationale: 'BR-1: человек не участвует между интервью и правками. В графе нет исходящих дуг человека из этого состояния.'
    derives_from:
      - graph
  - id: FACT-070
    slot: rights[человек,править,тесты]
    value: n/a
    source: derived
    rationale: 'BR-1: человек между интервью и правками не действует. В графе нет исходящих дуг человека из этого состояния.'
    derives_from:
