    slot: reversible[восстановить]
    value: "no"
    source: assumed
    rationale: Восстановление отменённой задачи не откатывает уже выполненную работу (журнал и state остаются); это запуск нового цикла, не откат. По аналогии с reversible[отменить]=no.
  - id: FACT-233
    slot: state_timeout[получена]
    value: "604800"
    source: derived
    rationale: 'DF-006 — задача подана человеком, BA не взялся в течение 7 дней = 604800 секунд → сигнал о зависшей задаче. BR-1: человек не возвращается после BA, но входное состояние «получена» — до BA.'
  - id: FACT-234
    slot: state_timeout[готово]
    value: "2592000"
    source: derived
    rationale: DF-002 — задача в готово, можно давно забыть. По BR-2 правки ≠ вето, новый цикл. 30 дней = 2592000 секунд — разумный период для возврата.
  - id: FACT-235
    slot: state_timeout[отменена_пользователем]
    value: "7776000"
    source: derived
    rationale: DF-011 — задача отменена, можно восстановить (TR-036). 90 дней = 7776000 секунд — долго, чтобы человек мог вернуться.
  - id: FACT-236
