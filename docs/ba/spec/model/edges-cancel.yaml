# Дуги графа переходов задачи: добавление отмены человеком (T8).
# Восемь дуг из активных состояний в новое состояние «отменена_пользователем»
# (event «человек_отменил», initiator: человек, action: отменить).
# Восстановление (event «человек_восстановил») ведёт в получена — полный
# перезапуск задачи. Если восстановление должно возвращать в ту же точку,
# где отменили — модель будет дополнена отдельными рёбрами «восстановлено_в_*».

transitions:
  - from: получена
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: интервью
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: спецификация
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: тесты
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: код
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: арбитраж
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: финальная_проверка
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: правки
    event: человек_отменил
    to: отменена_пользователем
    initiator: [человек]
    action: отменить

  - from: отменена_пользователем
    event: человек_восстановил
    to: получена
    initiator: [человек]
    otherwise: true
