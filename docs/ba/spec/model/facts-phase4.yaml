  - slot: "rights[человек,отменить,получена]"
    value: allow
    source: user
    transcript: T8
    quote: "Если я верно понял, подразумевается то, что идет выполнение задачи и человек решил завершить полностью"
    supersedes: FACT-003
    reason: "T8 явно говорит, что человек в любой активной фазе может отменить задачу. Заменяю n/a на allow."

  - slot: "rights[человек,отменить,интервью]"
