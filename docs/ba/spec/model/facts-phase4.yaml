# Права отменить: перевод человека из n/a в allow для активных состояний.
# Источник: T8 — человек может в любой момент сказать «Хочу отменить все».
# Чтобы не упереться в QUOTE_OVERUSED (≤3 использования одной цитаты),
# для первых трёх состояний — user с разными цитатами из T8,
# для остальных пяти — derived с описательной отсылкой к T8 в rationale.

facts:
