questions:
  - id: Q-001
    topic: помечать ли «отменить» как n/a во всех 50 слотах прав
    proposal: 'оставить как есть: зафиксировать n/a для всех прав(роль, отменить, состояние)'
    why: в T1–T7 нет ни одной фразы об отмене; BR-1 (человек не действует между интервью и правки) и BR-4 (при нехватке спеки решает оркестратор сам) делают отмену структурно невостребованной; помечать её как deny или allow не из чего
    if_wrong: если отменить в этой модели всё-таки нужен — например, человек может отменить свою задачу в любой момент — придётся расширить граф двумя-тремя дугами и переписать 50 слотов; пользователь этого намерения в источнике не высказал, но если оно есть, модель будет врать
  - id: Q-002
    topic: нужны ли отдельные таймауты для активных фаз (state_timeout) — отложены 10 слотов
    proposal: 'оставить defer DF-001..DF-010 до прояснения: активные фазы не имеют таймаута в источнике; если они появятся — дополню семейство явно'
    why: в T1–T7 про срок состояний не сказано ни слова; BR-1 (человек не возвращается после BA) делает таймауты интервью и активных фаз скорее неприменимыми, но терминальные (правки) и входные (получена) могли бы иметь разумные дефолты
    if_wrong: если источник в принципе подразумевает таймаут интервью (BA ждёт ответ человека) или таймаут активной фазы — пропустим сигнал о зависшей задаче, и система будет молча работать вечно
  - id: Q-003
    topic: насколько полон охват источника (5 разделов из 75 процитированы на уровне значений словаря и фактов)
    proposal: 'оставить как есть: 75 разделов T1–T7, процитировано 13; оставшиеся 62 раздела — это контекст и нарративные описания UC, не порождающие новых фактов'
    why: BRD состоит из 12 разделов, из них только 8 содержат прямые утверждения для модели (роли, состояния, права, видимость); UC повторяют BRD в развернутом виде и большая часть их содержания — это пересказ уже извлечённого
    if_wrong: если в непроцитированных разделах UC (например, A1–A3 альтернативных потоков) есть уникальные факты, которые я не подобрал — модель показывает «0 пробелов», а на самом деле что-то упущено
  - id: Q-004
    closes: Q-001
    answer: в этой модели «отменить» — действие человека из любой активной фазы; вводится состояние «отменена_пользователем» с восстановлением в получена
    transcript: T8
    quote: Если я верно понял, подразумевается то, что идет выполнение задачи и человек решил завершить полностью, то он может написать например «Хочу отменить все», в таком случае вся работа над проектом останавливается в том виде момент которого сказали отменить и помечается как «Работа отменена пользователем», при этом в любой момент работу можно восстановить.
  - id: Q-005
    closes: Q-002
    answer: Активные фазы (8 штук) и терминальное «отклонена_ba» — без таймаута (BR-1 + терминальность). Только входное «получена» (7д = 604800 сек), «готово» (30д = 2592000 сек), «отменена_пользователем» (90д = 7776000 сек) — с TTL. Закрытие DF-001..DF-011 через этот пакет.
    transcript: T2
    quote: полный журнал действий. Хранение локально + в git (локальный репозиторий или удалённый — github, codeberg и т. п.)
