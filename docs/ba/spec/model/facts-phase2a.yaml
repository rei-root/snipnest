# над задачей. Отсутствие дуг с action=отменить в графе — структурный сигнал.
# Помечаю n/a, поскольку BR-1 (человек между интервью и правки не действует)
# и BR-4 (нехватку спеки решает оркестратор без человека) делают отмену
# невостребованным действием в описанном потоке. Это предположение, а не вывод.

