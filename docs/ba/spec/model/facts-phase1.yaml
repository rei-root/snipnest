# Обратимость действий (family reversible).
# Источник: структурный — граф переходов и общее устройство фаз.

facts:
  - slot: "reversible[отменить]"
    value: "no"
    source: assumed
    rationale: "отмена по определению финальна: для восстановления нужен новый прогон, а не откат действия. В источнике (T1–T7) сценарий 'отменили, потом вернули' не описан ни разу."

  - slot: "reversible[править]"
    value: "yes"
    source: assumed
    rationale: "в графе TR-008 (код → код, event код_готов, guard 'есть непрошедший тест') и в BRD §FR-9 ('правки откатывают цикл к спеке целиком') правка моделируется как возврат к предыдущему состоянию, что предполагает её обратимость в рамках цикла."
