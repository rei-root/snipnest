    rationale: "TR-008 (event код_готов guard «есть непрошедший тест» → код → код) и TR-009 (код → арбитраж, action: править) — кодер пишет и правит код в фазе «код»."
    derives_from: [TR-008, TR-009]

  - slot: "rights[кодер,править,правки]"
    value: allow
