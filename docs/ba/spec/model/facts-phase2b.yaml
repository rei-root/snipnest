# Права править: роль × состояние (продолжение).
# Allow — там, где граф даёт дугу с action=править, либо источник явно говорит,
# что роль пишет/обновляет артефакт состояния. n/a — там, где роль структурно
# не действует в этом состоянии (derived из графа: нет исходящих дуг роли в этом
# состоянии с действием править).

facts:
  # === человек: позволяет править в своих состояниях ===
  - slot: "rights[человек,править,получена]"
    value: allow
    source: derived
    rationale: "TR-019 (event человек_уточнил_задачу initiator: человек action: править) — человек правит задачу до того, как BA её взял."
    derives_from: [TR-019]

  - slot: "rights[человек,править,интервью]"
    value: allow
    source: derived
    rationale: "TR-018 (event человек_дал_уточнение initiator: человек action: править) — человек отвечает на вопросы BA и правит требования во время интервью."
    derives_from: [TR-018]

  - slot: "rights[человек,править,готово]"
    value: allow
    source: derived
    rationale: "TR-014 (event человек_дал_правки initiator: человек action: править) — человек инициирует цикл правок из состояния «готово»."
    derives_from: [TR-014]

  # === ba: только в своих фазах ===
  - slot: "rights[ba,править,получена]"
    value: allow
    source: derived
    rationale: "TR-002 (event ba_взялся initiator: ba action: править) — ba берёт задачу и переводит её в интервью."
    derives_from: [TR-002]

  - slot: "rights[ba,править,интервью]"
    value: allow
    source: derived
    rationale: "TR-017 (event ba_уточнил_требования initiator: ba action: править) — ba уточняет требования во время интервью; T3:38 «BA уточняет до тех пор, пока вся необходимая информация не будет получена»."
    derives_from: [TR-017]

  # === оркестратор: фазы спецификации, арбитража, финальной проверки, эскалации правок ===
  - slot: "rights[оркестратор,править,спецификация]"
    value: allow
    source: derived
    rationale: "TR-020 (event оркестратор_уточнил_спеку initiator: оркестратор action: править) — оркестратор правит спеку в фазе спецификации (T2 FR-3)."
    derives_from: [TR-020]

  - slot: "rights[оркестратор,править,арбитраж]"
    value: allow
    source: derived
    rationale: "TR-021 (event оркестратор_уточнил_решение initiator: оркестратор action: править) — оркестратор выносит решение в арбитраже (T4 основной поток)."
    derives_from: [TR-021]

  - slot: "rights[оркестратор,править,финальная_проверка]"
    value: allow
    source: derived
    rationale: "TR-022 (event оркестратор_перепроверил initiator: оркестратор action: править) — оркестратор проходит три слоя проверки (T2 FR-8)."
    derives_from: [TR-022]

  - slot: "rights[оркестратор,править,правки]"
    value: allow
    source: derived
    rationale: "TR-023 (event оркестратор_уточнил_правки initiator: оркестратор action: править) — оркестратор уточняет правки в фазе правок; BR-4 «принятые решения» фиксируются здесь же."
    derives_from: [TR-023]

  # === тестописатель ===
  - slot: "rights[тестописатель,править,тесты]"
