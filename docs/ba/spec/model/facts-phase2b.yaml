    source: derived
    rationale: "TR-024 (event тестописатель_дописал_тесты initiator: тестописатель action: править) — тестописатель пишет unit→integration→e2e последовательно (T2 FR-4)."
    derives_from: [TR-024]

  - slot: "rights[тестописатель,править,правки]"
