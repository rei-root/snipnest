# Дополнительные дуги графа переходов: править внутри фазы.
# Источники: T3:38 (BA уточняет до получения полной информации),
# T2 FR-3/FR-4/FR-5/FR-7/FR-8, T4 основной поток, T5 §§3, 5, 6.
# Каждая дуга — самоссылка фазы: роль редактирует свой артефакт перед переходом дальше.

transitions:
  - from: интервью
    event: ba_уточнил_требования
    to: интервью
    initiator: [ba]
    action: править

  - from: интервью
    event: человек_дал_уточнение
    to: интервью
    initiator: [человек]
    action: править

  - from: получена
    event: человек_уточнил_задачу
    to: получена
    initiator: [человек]
    action: править

  - from: спецификация
    event: оркестратор_уточнил_спеку
    to: спецификация
    initiator: [оркестратор]
    action: править

  - from: арбитраж
    event: оркестратор_уточнил_решение
    to: арбитраж
    initiator: [оркестратор]
    action: править

  - from: финальная_проверка
    event: оркестратор_перепроверил
    to: финальная_проверка
    initiator: [оркестратор]
    action: править

  - from: правки
    event: оркестратор_уточнил_правки
    to: правки
    initiator: [оркестратор]
    action: править

  - from: тесты
    event: тестописатель_дописал_тесты
    to: тесты
    initiator: [тестописатель]
    action: править

  - from: правки
    event: тестописатель_обновил_тесты
    to: правки
    initiator: [тестописатель]
    action: править

  - from: правки
    event: кодер_обновил_код
    to: правки
    initiator: [кодер]
    action: править
