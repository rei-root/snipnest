# Visibility: роль × состояние (50 слотов).
# full — роль активна в состоянии (initiator исходящих дуг в графе; либо
#        источник прямо называет её «участником» этой фазы).
# limited — роль получает артефакт состояния как вход для своей фазы.
# none  — роль структурно вне этого состояния (derived из графа: нет исходящих
#          дуг роли из этого состояния с любым действием).

