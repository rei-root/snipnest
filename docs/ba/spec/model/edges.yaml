# Дуги графа переходов задачи в жизненном цикле оркестратора.
# Соответствует BRD §6 (базовый поток) и UC (T3–T7).
# Каждое условное разветвление оформлено парой дуг с общим событием:
# одна с guard, другая с otherwise=true.

terminal:
  - отклонена_ba

transitions:
  # Вход извне: человек подал задачу → получена
  - from: ""
    event: поступила_задача
    to: получена
    automatic: true

  - from: получена
    event: ba_взялся
    to: интервью
    initiator: [ba]
    action: править

  - from: интервью
    event: ba_закончил
    to: спецификация
    initiator: [ba]
    otherwise: true

  - from: интервью
    event: ba_закончил
    to: отклонена_ba
    initiator: [ba]
    guard: "BA решил, что задачи не связные (BR-5, FR-2, UC-1 A1)"

  - from: спецификация
    event: спека_готова
    to: тесты
    initiator: [оркестратор]

  - from: тесты
    event: тесты_готовы
    to: код
    initiator: [тестописатель]

  - from: код
    event: код_готов
    to: финальная_проверка
    initiator: [кодер]
    otherwise: true

  - from: код
    event: код_готов
    to: код
    initiator: [кодер]
    guard: "есть непрошедший тест, который кодер не оспорил"

  - from: код
    event: тест_оспорен
    to: арбитраж
    initiator: [кодер]
    action: править

  - from: арбитраж
    event: арбитраж_решил
    to: код
    initiator: [оркестратор]
    guard: "решение: отклонить аргумент кодера (UC-2 основной поток)"

  - from: арбитраж
    event: арбитраж_решил
    to: тесты
    initiator: [оркестратор]
    otherwise: true

  - from: финальная_проверка
    event: проверка_завершена
    to: готово
    initiator: [оркестратор]
    otherwise: true

  - from: финальная_проверка
    event: проверка_завершена
    to: код
    initiator: [оркестратор]
    guard: "минимум один из трёх слоёв не прошёл (FR-8)"

  - from: готово
    event: человек_дал_правки
    to: правки
    initiator: [человек]
    action: править

  - from: правки
    event: правки_приняты
    to: спецификация
    initiator: [человек]
    otherwise: true

  - from: правки
    event: правки_приняты
    to: интервью
    initiator: [оркестратор]
    guard: "правка затрагивает архитектуру или весь связный набор (UC-3 A3)"
