facts:
- id: R1
  text: 'Нынешний установщик — shell-скрипт: он работает только в терминале и ставит
    пакет .deb, то есть привязан к debian-based системам. На Fedora, Arch, SUSE и
    Alpine его использовать нельзя, а поставить приложение нечем. Само приложение
    — исключительно GUI, значит и установщик должен быть GUI: человек запускает файл
    и видит окно, где написано, что определено, что будет поставлено и куда. Установщик
    ставит портативный образ приложения (тот же, что идёт в релиз) и, если человек
    согласится, ставит зависимости из родного пакетного менеджера его системы.'
  source: user
  nfr: false
- id: R2
  text: 'Владелец проекта — он же заказчик: решения об ограничениях и о том, как выглядит
    установщик, принимает он. Конечный пользователь — обычный человек с Linux-машиной:
    у него нет Python, нет желания разбираться в форматах и нет прав администратора
    по умолчанию. Сборщик — CI, который собирает установщик по тегу и кладёт его в
    релиз.'
  source: user
  nfr: false
- id: R3
  text: '1) собирается dist/snipnest-installer-linux-amd64.bin — один файл: приложение
    на Qt (PySide6), собранное тем же PyInstaller; внутри Qt, Python и код установщика,
    системный Python и Qt не нужны; 2) установщик — окно, а не текстовый режим: при
    запуске он показывает, что определил (семейство дистрибутива, версия glibc), что
    собирается поставить и куда; 3) в окне есть список зависимостей с галочками; по
    умолчанию отмечены все, что есть в репозитории этой системы, и снятие галочки
    убирает этот пакет из установки; 4) зависимости ставятся родным пакетным менеджером
    системы: apt-get (debian), dnf (rhel/fedora), pacman (arch), zypper (suse), apk
    (alpine), emerge (gentoo); пакета, о котором репозиторий не знает, установщик
    не предлагает и говорит об этом; 5) установщик кладёт портативный образ: в /opt/snipnest,
    лаунчер в /usr/local/bin, ярлык в /usr/share/applications, иконки в /usr/share/icons/hicolor
    — либо, в домашнем режиме, в ~/.local/opt/ snipnest, ~/.local/bin и ~/.local/share;
    6) права администратора берутся через pkexec (polkit): пароль спрашивает система;
    в домашнем режиме права не нужны; 7) образ качается из релиза и проверяется по
    SHA256SUMS, показывается прогресс; 8) после установки окно показывает итог: что
    поставлено, что не поставлено и почему; 9) прежний shell-установщик из релиза
    уходит: .bin — это графический установщик.'
  source: user
  nfr: false
- id: R4
  text: '1) ничего не ставится без согласия: без отметки в списке пакет не ставится,
    без подтверждения кнопкой «Установить» ничего не происходит; 2) пакетным менеджером
    ставятся только перечисленные зависимости, ничего больше; 3) установщик не трогает
    чужие файлы: свои пути проверяет и о перезаписи предупреждает; 4) до установки
    проверяется версия glibc: если она ниже нужной, установщик говорит об этом и не
    ставит; 5) если polkit недоступен, установщик говорит об этом и предлагает установку
    в домашний каталог; 6) мастер компонентов внутри приложения работает как прежде:
    установщик ставит то, что есть в репозитории системы, мастер — то, чего нет.'
  source: user
  nfr: false
- id: R5
  text: '1) архитектура только amd64, версия 0.2.0; 2) правила репозитория прежние:
    ruff с line-length 100, mypy --strict, не больше 300 строк на файл, аннотации
    типов везде, комментарии и тексты — по-русски, как в существующем коде; 3) тесты,
    кроме помеченных live, в сеть не ходят и систему не меняют; 4) знаменатель обязательств
    остаётся 89/89, нормативная модель не меняется; 5) артефакты собираются в CI по
    тегу и выкладываются в Releases; окно не подвисает: загрузка и установка идут
    в отдельном потоке, события переносятся в GUI-поток через сигналы Qt.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: сборка под arm64 и другие архитектуры, Windows и macOS, собственные
    .rpm и .pkg.tar.zst, автообновление установщика, подпись артефактов, flatpak и
    snap, изменение нормативной модели предметной области и её 89 обязательств, переписывание
    дословных цитат интервью T2, изменение истории git.'
  source: user
  nfr: false
- id: AC1
  text: '1) make dist-installer собирает dist/snipnest-installer-linux-amd64.bin —
    ELF-файл, внутри Qt и Python, а не shell-скрипт; 2) установщик запускается и показывает
    окно: в окне видны семейство дистрибутива, план установки и список зависимостей
    с галочками, отмеченными по умолчанию; 3) снятие галочки с пакета убирает его
    из команды установки; 4) для debian-системы команда установки пакетов строится
    через apt-get, для fedora — dnf, для arch — pacman, для suse — zypper, для alpine
    — apk, для gentoo — emerge; 5) в системном режиме образ кладётся в /opt/snipnest,
    лаунчер — в /usr/local/bin, в домашнем — в ~/.local/opt/snipnest и ~/.local/bin,
    и права root не нужны; 6) для установки в систему вызывается pkexec; если его
    нет, установщик объясняет это и предлагает домашний режим; 7) образ скачивается
    и проверяется по SHA256SUMS; 8) пакет .deb собирается как раньше и в релиз попадает
    как раньше; 9) полный прогон тестов, типов и линтеров зелёный, знаменатель 89/89.'
  source: user
  nfr: false
