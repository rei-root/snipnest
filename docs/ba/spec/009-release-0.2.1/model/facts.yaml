facts:
- id: R1
  text: 'Релиз 0.2.0 вышел с прежним shell-установщиком и с пакетами, которые не ставятся
    на Fedora, Arch, SUSE и Alpine. В main уже слиты две задачи: починка установщиков
    (007) и графический установщик (008). Релиз 0.2.0 на GitHub раздаёт старые артефакты,
    поэтому их надо перевыпустить: тег v0.2.1, а в нём — новый установщик и новые
    артефакты.'
  source: user
  nfr: false
- id: R2
  text: 'Владелец проекта — он же заказчик: он решил, что релиз обновляется на 0.2.1.
    Конечный пользователь получает артефакты из Releases и не должен заметить разницы,
    кроме нового установщика. Сборщик — CI, который по тегу собирает артефакты и выкладывает
    их в Releases.'
  source: user
  nfr: false
- id: R3
  text: '1) версия приложения — 0.2.1, и она записана в одном месте: в src/snipnest/__init__.py;
    2) имена артефактов собираются из этой версии: пакет snipnest_0.2.1_amd64.deb,
    образ snipnest-0.2.1-linux-glibc-2.38-x86_64.AppImage; 3) установщик, собранный
    для релиза, внутри знает версию 0.2.1 и адрес релиза v0.2.1; 4) релиз публикуется
    под тегом v0.2.1: CI собирает артефакты и выкладывает их в Releases; 5) прежней
    версии 0.2.0 не остаётся ни в коде, ни в тестах, ни в README.'
  source: user
  nfr: false
- id: R4
  text: '1) тег ставится только после того, как задача принята и слита в main — правило
    репозитория; 2) версия меняется в одном месте: остальное читает её, а не повторяет
    литерал; 3) тесты, которым версия не важна, сверяются с версией пакета, а не с
    литералом, чтобы следующий релиз не требовал правок во многих местах; проверка
    «версия соответствует выпуску» остаётся литералом.'
  source: user
  nfr: false
- id: R5
  text: '1) архитектура только amd64; 2) правила репозитория прежние: ruff с line-length
    100, mypy --strict, не больше 300 строк на файл; 3) тесты, кроме помеченных live,
    в сеть не ходят; 4) знаменатель обязательств остаётся 89/89, нормативная модель
    не меняется; 5) артефакты собираются в CI по тегу и выкладываются в Releases.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: подпись артефактов и нотарификация, автообновление приложения
    и установщика, сборка под arm64 и другие архитектуры, Windows и macOS, flatpak
    и snap, изменение нормативной модели предметной области и её 89 обязательств,
    переписывание дословных цитат интервью T2, изменение истории git.'
  source: user
  nfr: false
- id: AC1
  text: '1) в src/snipnest/__init__.py версия 0.2.1, и других её значений в коде,
    тестах и README нет; 2) имена артефактов собираются из версии пакета: пакет snipnest_0.2.1_amd64.deb
    и образ snipnest-0.2.1-linux-glibc-2.38-x86_64.AppImage; 3) собранный установщик
    внутри содержит версию 0.2.1 и адрес релиза v0.2.1; 4) тег v0.2.1 отправлен в
    репозиторий, CI собрал артефакты и выложил их в Releases; 5) полный прогон тестов,
    типов и линтеров зелёный, знаменатель 89/89.'
  source: user
  nfr: false
