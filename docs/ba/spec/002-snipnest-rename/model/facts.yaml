facts:
- id: R1
  text: 'переименование: инструмент прежде назывался Gallary Downloader и жил в репозитории
    gallery-dl-gui; владелец переименовал его в Snipnest и переводит в новый репозиторий
    snipnest. Причина прежняя: личный инструмент для скачивания изображений из Pinterest
    без терминала, пользователь один — сам владелец. Само переименование меняет идентичность
    (имя, ярлык, иконку, пакет, репозиторий), а не функциональность: загрузка, прогресс,
    итог, перетаскивание ссылок и работа с токеном остаются как были.'
  source: user
  nfr: false
- id: R2
  text: пользователь один — владелец, приложение запускается на его личной машине
    в графическом сеансе KDE. Имя в меню приложений теперь «Snipnest» (с большой буквы),
    имя инструмента в целом — snipnest. Репозиторий проекта переинициализируется на
    git@github.com:rei-root/snipnest.git; история коммитов сохраняется, меняются URL
    удалённого репозитория и идентичность продукта.
  source: user
  nfr: false
- id: R3
  text: 'переименование всего инструмента: пакет Python gallary_downloader → snipnest;
    дистрибутив gallary-downloader → snipnest; команда запуска gallary-downloader
    → snipnest; файл ярлыка packaging/gallary-downloader.desktop → packaging/snipnest.desktop
    с Name=Snipnest, Exec=snipnest, Icon=snipnest, StartupWMClass=snipnest; логотип
    logo/gallery-dl-gui-logo.png → logo/snipnest.png и устанавливается как snipnest.png;
    заголовок окна и имя приложения — «Snipnest»; имя desktop-файла, сообщаемое QApplication,
    — snipnest; папка конфига ~/.config/snipnest; сервис keyring snipnest. Функциональность
    не меняется: скачивание картинки и альбома, прогресс, скорость, счётчик «скачано
    X из Y», список файлов, итог, перетаскивание ссылок, токен в системном хранилище.'
  source: user
  nfr: false
- id: R4
  text: 'старый ярлык gallary-downloader.desktop, старые иконки gallary-downloader.png
    и старый лаунчер удаляются из системы при установке новых — в меню приложений
    не должно остаться двух записей; пользовательские данные переносятся: настройки
    из ~/.config/gallary-downloader и токен Pinterest из сервиса keyring gallary-downloader
    переносятся в новое место при первом запуске, чтобы владелец не вводил токен заново;
    дословная запись интервью T2 и её цитаты не переписываются, новое имя фиксируется
    в артефактах задачи; нормативная часть доменной модели (89 обязательств) не меняется
    — переименование не трогает предметную область.'
  source: user
  nfr: false
- id: R5
  text: 'переименование не меняет поведение приложения: полный набор тестов, типы
    и линтеры остаются зелёными; правила репозитория прежние — ruff с line-length
    100, mypy --strict, не больше 300 строк на файл, аннотации типов везде, комментарии
    в коде по-английски; знаменатель обязательств остаётся 89/89; оракул проверяет
    новое имя механически (desktop-файл, имя окна, отсутствие старого имени в дереве),
    а не на словах.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: переработка функциональности, новые источники (YouTube, TikTok),
    авторизация по логину и паролю, плейлисты и сохранённые Pinterest, поиск по ключевым
    словам, планировщик, мультиаккаунт, сборка в один файл (PyInstaller), изменение
    нормативной модели предметной области и её 89 обязательств, переписывание дословных
    цитат интервью T2, изменение истории git, перенос на другую платформу, изменение
    поведения загрузки.'
  source: user
  nfr: false
- id: AC1
  text: 1) в меню приложений KDE есть запись «Snipnest», и старой «Gallary Downloader»
    нет; 2) ярлык packaging/snipnest.desktop запускает приложение (Exec=snipnest),
    иконка snipnest.png установлена; 3) заголовок окна и имя приложения — «Snipnest»;
    4) пакет импортируется как snipnest, команда snipnest доступна; 5) в рабочем дереве
    нет упоминаний старого имени, кроме исторических артефактов — дословной записи
    T2, артефактов задачи 001 и брифа задачи 001; 6) настройки и токен старого приложения
    переносятся в новое место автоматически; 7) удалённый репозиторий — git@github.com:rei-root/snipnest.git,
    история сохранена; 8) полный прогон зелёный, знаменатель 89/89.
  source: user
  nfr: false
