facts:
- id: R1
  text: 'Владелец хочет, чтобы приложение выглядело как законченный продукт: починить аватарку (иконку приложения), разгрузить верхнюю часть окна меню, осовременить дизайн и дать выбор темы. Запрос дословно: «Необходимо починить аватарку и поправить UI приложения. Логотип приложения теперь будет таким (лого по этому пути /home/sato/Документы/snipnest/logo/snipnest.svg). Символ приложения который будет использоваться внутри приложения будет таким (лежит по пути /home/sato/Документы/snipnest/logo/snipnest-symbolic.svg). Касаемо изменений UI: 1. Хотелось бы добавить верхнюю плашку с `файл` `вид` и тд. Не обязательно будет именно это, просто разгрузить сам UI текущий, перенести туда кнопки `токен Pinterest`, `Открыть Pinterest` (можно удалить вовсе, она не имеет практического смысла), `Компоненты`, `Путь к gallary-dl`, `Путь к yt-dlp`, `Cookies YouTube`. Остальные кнопки оставь. 2. Дополнительно "осовремень дизайн", добавь может какие-то анимации (немного, но можно, главное не много). 3. Добавь возможность смены темы (в настройках) с темной на светлую.» Причина прежняя: личный инструмент без терминала, пользователь один — сам владелец; приложением пользуются каждый день, и вид окна для него часть работы, а не отдельная задача. Ответы владельца на семь вопросов интервью: по умолчанию по каждому пункту, кроме состава меню, где он добавил отдельное окно настроек, и удаления «Открыть Pinterest», где он сказал «удаляем насовсем, практического смысла не несёт».'
  source: user
  nfr: false
- id: R2
  text: 'Пользователь один — владелец, приложение запускается на его личной машине в графическом сеансе KDE. Новых ролей и внешних сервисов не появляется: тема, меню, окно настроек и иконка — это внешний вид и настройки, а не новый пользователь и не новый актёр. Владелец сам и есть заказчик: он инициатор работы, потому что окном пользуется каждый день, и его интерес — чтобы приложение выглядело и работало как законченный продукт на его машине.'
  source: user
  nfr: false
- id: R3
  text: '1) Иконка приложения: logo/snipnest.svg становится иконкой приложения — окно показывает её в своём заголовке и в панели задач, ярлык приложения и установщик ставят её в тему иконок, сборки AppImage и .deb несут её. 2) Монохромный logo/snipnest-symbolic.svg (currentColor) используется внутри приложения: в шапке окна рядом с названием «Snipnest», у пунктов меню и в окне «О программе». 3) В верхней части окна появляется строка меню: «Файл» — Выбрать папку сохранения…, Токен Pinterest…, Cookies YouTube…, Путь к gallery-dl…, Путь к yt-dlp…, Компоненты…, Выход; «Вид» — Тема (Тёмная / Светлая / Как в системе), Показать лог; «Справка» — О программе. 4) Кнопки «Токен Pinterest», «Компоненты…», «Путь к gallery-dl», «Путь к yt-dlp», «Cookies YouTube» переезжают из верхней части окна в меню; кнопка «Открыть Pinterest» удаляется из приложения совсем — вместе с обработчиком и статусом; кнопки «Скачать» и «Выбрать папку» остаются на месте. 5) Появляется отдельное всплывающее окно настроек: «Файл → Настройки…» — в нём собраны папка сохранения, токен Pinterest, cookies YouTube, путь к gallery-dl, путь к yt-dlp и раздел «Внешний вид» с выбором темы; те же пункты остаются и в меню «Файл» как быстрый доступ. 6) Тема: три значения — «Тёмная», «Светлая», «Как в системе»; по умолчанию «Как в системе»; выбор применяется сразу, без перезапуска, и помнится между запусками; переключение доступно и в меню «Вид», и в окне настроек. 7) Оформление пересобирается на едином стиле Fusion с собственными акцентами: скругления, отступы, акцентный цвет из логотипа. 8) Анимации сдержанные и ровно две: плавное появление строки загрузки и плавное разворачивание/сворачивание лога.'
  source: user
  nfr: false
- id: R4
  text: '1) Тема по умолчанию «Как в системе»: пока владелец не выбрал тему руками, приложение следует системной схеме окраски (на его машине — тёмной). 2) Смена темы применяется сразу и целиком: новая палитра и новая таблица стилей ставятся разом, а не точечной правкой, — иначе часть оформления остаётся от прежней темы. 3) Цвета оформления берутся из ролей палитры Qt, а не из вписанных литералов: иначе тёмная и светлая темы разъедутся; свои таблицы цветов вручную не ведутся — палитру под схему собирает сама Qt. 4) Монохромный символ рисуется цветом текста темы и перекрашивается при смене темы, а не остаётся выжженным в одном цвете. 5) Иконка приложения одна — цветной SVG; размеры PNG для тем иконок генерируются из неё, а не хранятся отдельными файлами произвольного размера. 6) Установщик иконок не зависит от ImageMagick: размеры режутся средствами Qt, которые и так есть в зависимостях. 7) Окно настроек показывает текущие значения и меняет их теми же действиями, что и меню: выбор папки, ввод токена, выбор cookies, выбор путей к бинарникам, выбор темы. 8) Поведение загрузки не меняется: то же поле ссылки, та же папка сохранения, тот же список загрузок, тот же итог «скачано / пропущено / ошибок», тот же прогресс и скорость; модель предметной области не меняется — 89 обязательств остаются в силе, новых полей, ролей и состояний нет.'
  source: user
  nfr: false
- id: R5
  text: 'загрузка и перекодировка идут в отдельном потоке, окно не подвисает; анимации короткие (порядка 200 мс) и не мешают вводу; переключение темы не требует перезапуска приложения; тесты, кроме помеченных live, в сеть не ходят и не требуют внешних программ; правила репозитория прежние: ruff с line-length 100, mypy --strict, не больше 300 строк на файл, аннотации типов везде, запрещён print() в продовом коде; знаменатель обязательств остаётся 89/89.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: изменение работы загрузки, форматов сохранения и бинарников gallery-dl/yt-dlp; новые источники кроме Pinterest и YouTube; мастер установки компонентов (кроме иконки он не трогается); изменение нормативной модели предметной области и её 89 обязательств; темы, кроме тёмной и светлой («Как в системе» — не отдельная тема, а следование системе); сборка под Windows и macOS; переписывание дословных цитат интервью T2; изменение истории git.'
  source: user
  nfr: false
- id: AC1
  text: '1) Окно приложения показывает в своём заголовке и в панели задач иконку из logo/snipnest.svg, а не заглушку; монохромный символ logo/snipnest-symbolic.svg виден в шапке окна рядом с названием «Snipnest» и у пунктов меню. 2) В верхней части окна есть строка меню с меню «Файл», «Вид», «Справка» и указанным составом пунктов; кнопок «Токен Pinterest», «Компоненты…», «Путь к gallery-dl», «Путь к yt-dlp», «Cookies YouTube» в верхней части окна больше нет, а «Скачать» и «Выбрать папку» на месте; кнопки «Открыть Pinterest» в приложении нет вообще. 3) «Файл → Настройки…» открывает отдельное окно, где собраны папка сохранения, токен Pinterest, cookies YouTube, пути к gallery-dl и yt-dlp и раздел «Внешний вид» с выбором темы; изменение значения применяется сразу и переживает перезапуск приложения. 4) Выбор темы «Светлая» и «Тёмная» применяется мгновенно, без перезапуска, и меняет вид всего окна, включая меню, списка загрузок и лога; после перезапуска выбранная тема сохраняется; при значении «Как в системе» приложение следует системной схеме окраски. 5) Строка загрузки появляется с короткой анимацией, лог разворачивается и сворачивается плавно; других анимаций нет. 6) Ярлык приложения и установщик ставят иконку в тему иконок (hicolor), сборки AppImage и .deb несут иконку из logo/snipnest.svg; установка иконок не требует ImageMagick. 7) Полный прогон тестов, типов и линтеров зелёный, знаменатель 89/89.'
  source: user
  nfr: false