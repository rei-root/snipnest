facts:
- id: R1
  text: 'владелец хочет качать видео с YouTube тем же инструментом, что и картинки
    с Pinterest: он смотрит ролики и хочет оставлять их у себя на диске без терминала.
    Запрос владельца дословно: «качать видео с youtube, любые, и длинные ролики и
    shorts. Все точно так же, выбираешь папку для сохранения и все, сохраняет видео
    в эту папку». Причина прежняя: личный инструмент без терминала, пользователь один
    — сам владелец. YouTube добавляется к Pinterest как второй источник ссылок; предметная
    область приложения (загрузка как актор, состояния, права, видимость) не меняется
    — меняется только то, кто и чем качает.'
  source: user
  nfr: false
- id: R2
  text: 'пользователь один — владелец, приложение запускается на его личной машине
    в графическом сеансе KDE. Новых ролей не появляется: YouTube — это ещё один источник
    ссылок, а не новый пользователь и не новый внешний сервис, с которым договаривается
    человек. Владелец сам и есть заказчик функции.'
  source: user
  nfr: false
- id: R3
  text: '1) ссылка на YouTube в то же поле ссылки распознаётся как YouTube-источник:
    обычное видео (watch?v=...), короткая ссылка youtu.be, Shorts (/shorts/...), а
    также /live/ и /embed/; 2) загрузку YouTube выполняет внешний бинарник yt-dlp
    — у gallery-dl своего экстрактора YouTube нет, — и приложение находит его в PATH
    либо по пути, который владелец указал в настройках «Путь к yt-dlp»; 3) ролик скачивается
    в выбранную папку одним файлом: лучшее доступное качество, видео и звук склеиваются
    в mp4 средствами ffmpeg, имя файла — «Название [id].mp4»; 4) во время загрузки
    окно показывает настоящий процент выполнения и текущую скорость, а не пустой прогресс
    до самого конца; 5) вывод yt-dlp, включая предупреждения, виден в логе приложения,
    а ошибка yt-dlp (ролик недоступен, возрастное ограничение, проверка бота) показывается
    владельцу и переводит загрузку в состояние «ошибка»; 6) уже скачанный файл не
    перекачивается — такая загрузка считается пропущенной; 7) поведение Pinterest
    не меняется: то же поле ссылки, та же папка сохранения, тот же список загрузок,
    тот же итог «скачано / пропущено / ошибок».'
  source: user
  nfr: false
- id: R4
  text: '1) выбранная папка — конечная точка: файл лежит прямо в ней, своих подкаталогов
    приложение не заводит; 2) одна ссылка — одно видео: плейлист не скачивается целиком;
    3) качество — лучшее доступное, с предпочтением mp4 (H.264 и AAC), склейку видео
    и звука делает ffmpeg; 4) имя файла: название ролика и идентификатор видео, длинные
    названия обрезает yt-dlp; 5) уже скачанный файл не перекачивается, загрузка помечается
    пропущенной; 6) приложение само не разрешает yt-dlp тянуть удалённые компоненты
    (скрипты челленджера с GitHub) — это решение владельца, оно описано в README;
    JS-рантайм (deno или node) используется только если он уже установлен в системе,
    а его отсутствие показывается владельцу как предупреждение, а не как ошибка; 7)
    нормативная модель предметной области не меняется: 89 обязательств остаются в
    силе, YouTube — это ещё один исполнитель, а не новый актор и не новое состояние.'
  source: user
  nfr: false
- id: R5
  text: 'загрузка идёт в отдельном потоке, окно не подвисает; тесты, кроме помеченных
    live, в сеть не ходят; правила репозитория прежние: ruff с line-length 100, mypy
    --strict, не больше 300 строк на файл, аннотации типов везде, комментарии в коде
    по-английски; знаменатель обязательств остаётся 89/89; yt-dlp и ffmpeg — внешние
    программы, а не пакеты Python: в зависимости проекта они не добавляются и устанавливаются
    владельцем в системе.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: плейлисты YouTube целиком, скачивание субтитров и обложек, ручной
    выбор качества и других настроек загрузки, авторизация по логину и паролю и cookie-файлы
    YouTube, другие источники (TikTok и прочие), поиск по ключевым словам, планировщик,
    сборка в один файл (PyInstaller), изменение нормативной модели предметной области
    и её 89 обязательств, переписывание дословных цитат интервью T2, изменение истории
    git.'
  source: user
  nfr: false
- id: AC1
  text: 1) ссылка на обычное видео YouTube, короткая ссылка youtu.be и ссылка на Shorts
    вставляются в то же поле ссылки и распознаются как YouTube — окно не пишет «ссылка
    не распознана», — и загрузка попадает в список; 2) после загрузки в выбранной
    папке лежит ровно один файл — видео со звуком — с именем «Название [id].mp4»,
    файл открывается и проигрывается; 3) то же самое работает для Shorts и для длинного
    ролика; 4) во время загрузки прогресс-бар идёт по настоящему проценту, скорость
    видна в строке загрузки; 5) вывод yt-dlp виден в логе, а на недоступном ролике
    окно показывает ошибку yt-dlp и загрузка переходит в состояние «ошибка»; 6) если
    yt-dlp не найден, приложение сообщает об этом и предлагает указать путь в настройках
    «Путь к yt-dlp»; 7) поведение Pinterest не изменилось, полный прогон тестов, типов
    и линтеров зелёный, знаменатель 89/89.
  source: user
  nfr: false
