# Словарь домена «оркестратор автономной разработки».
# Каждое значение перечисления — цитата из дословной записи (T1–T7).
# Цитата сверяется побайтово: пересказ не пройдёт (QUOTE_NOT_FOUND).

enums:
  role:
    - id: человек
      label: "заказчик инструмента; единственный пользователь MVP"
      transcript: T2
      quote: "Человек (заказчик) | Даёт стартовое интервью; инициирует цикл правок после «готово»."
    - id: ba
      label: "бизнес-аналитик — проводит интервью и фиксирует требования"
      transcript: T2
      quote: "Бизнес-аналитик (BA-скил) | Проводит стартовое интервью. Формирует требования и критерии приёмки. Решает, являются ли задачи связными."
    - id: оркестратор
      label: "центральный агент, ведёт фазы и арбитрит"
      transcript: T2
      quote: "Оркестратор | Центральный агент. Руководит фазами, арбитрит спорные ситуации. Пишет регламент арбитража при первой задаче."
    - id: тестописатель
      label: "пишет тесты трёх типов по спецификации"
      transcript: T2
      quote: "Тестописатель | Пишет тесты трёх типов по спецификации."
    - id: кодер
      label: "пишет код под тесты, может оспорить тест"
      transcript: T2
      quote: "Кодер | Пишет код, проходящий тесты. Может оспорить тест."

  state:
    - id: получена
      label: "задача пришла в систему, BA её ещё не взял"
      transcript: T3
      quote: "Человек пишет задачу в CLI или чат."
    - id: интервью
      label: "BA проводит интервью с человеком"
      transcript: T3
      quote: "BA проводит серию вопросов по подтемам:"
    - id: отклонена_ba
      label: "BA отказал: задачи не относятся к одной предметной области"
      transcript: T3
      quote: "BA явно отказывается передавать их, с обоснованием (FR-2, BR-8)."
    - id: спецификация
      label: "оркестратор формирует спецификацию по требованиям BA"
      transcript: T2
      quote: "Оркестратор формирует спецификацию на основе требований BA. Спека — источник истины для арбитража."
    - id: тесты
      label: "тестописатель пишет unit → integration → e2e последовательно"
      transcript: T2
      quote: "Тестописатель пишет тесты трёх типов: unit, integration, e2e. Прогоняются последовательно."
    - id: код
      label: "кодер пишет код под тесты; может оспорить тест"
      transcript: T2
      quote: "Кодер пишет код, проходящий все три уровня тестов."
    - id: арбитраж
      label: "кодер оспорил тест; оркестратор выносит решение по правилам"
      transcript: T2
      quote: "Кодер может оспорить тест у оркестратора. Решение — по правилам (спека + регламент арбитража). Без привлечения человека."
    - id: финальная_проверка
      label: "три слоя проверки одновременно: чек-лист, traceability, e2e"
      transcript: T2
      quote: "Чек-лист критериев приёмки из BA-фазы (каждый пункт проверен)."
    - id: правки
      label: "человек дал правки после «готово», полный откат к спеке"
      transcript: T2
      quote: "После «готово» человек может дать правки (дизайн, логика и т. п.). Правки откатывают цикл к спеке целиком, далее — обновление тестов и кода."
    - id: готово
      label: "продукт работоспособен, тесты зелёные, требования покрыты"
      transcript: T2
      quote: "Оркестратор объявляет «готово»."
    - id: отменена_пользователем
      label: "человек прервал работу на любой активной фазе; восстановима"
      transcript: T8
      quote: "в таком случае вся работа над проектом останавливается в том виде момент которого сказали отменить и помечается как «Работа отменена пользователем»"
