facts:
- id: R1
  text: 'бизнес-контекст: личный инструмент для удобного скачивания изображений с
    Pinterest без использования терминала. Пользователь один — сам владелец. Причина:
    часто приходится качать с Pinterest, терминал неудобен. gallery-dl уже установлен
    в системе, приложение должно использовать его как внешний бинарник (автономно).'
  source: user
  nfr: false
- id: R2
  text: 'стейкхолдеры и пользователи: единственный пользователь — владелец, для личного
    использования. Запуск на личной машине, графический сеанс KDE, gallery-dl доступен
    из того же окружения. Пользователь хочет удобства GUI (предпочтение Qt/Python).'
  source: user
  nfr: false
- id: R3
  text: 'требования: одно поле для ссылки с автоопределением картинка/альбом; скачивание
    одной картинки по ссылке; скачивание целого альбома по ссылке; несколько загрузок
    одновременно; показ прогресса загрузки, скорости, счётчика ''скачано X из Y'',
    списка файлов; итог по завершении (скачано/пропущено/ошибок); отображение папки
    сохранения с возможностью её изменить (выбор папки), выбор запоминается между
    запусками; collapsible-лог вывода gallery-dl для диагностики; drag-and-drop ссылки
    в окно; обработка ошибок без падения с понятными сообщениями и возможностью повторить;
    вставка токена/cookie Pinterest через GUI, хранение в системном keyring (безопаснее,
    не в открытом конфиге), пароль в GUI не вводится; кнопка ''открыть Pinterest в
    браузере''; логотип из папки logo/; ярлык в меню приложений KDE с именем ''Gallary
    Downloader''; запуск как обычное приложение; архитектура с расширяемым слоем источников
    под будущие YouTube/TikTok (вне задачи).'
  source: user
  nfr: false
- id: R4
  text: 'бизнес-правила и ограничения: путь сохранения по умолчанию /home/sato/Изображения/Pinterest
    (ru-локаль), меняется через выбор папки и запоминается; структуру папок и имена
    файлов определяет gallery-dl (для альбомов — подпапка альбома), вмешательства
    нет, показывается итог: скачано/пропущено; коллизии файлов не перезаписываются
    (поведение gallery-dl по умолчанию); несколько загрузок одновременно без ограничения
    числа (упоминается в NFR, не задаёт лимит); при ошибке показывается понятное сообщение,
    приложение не падает, есть повтор; если бинарник gallery-dl не найден в PATH —
    сообщение об этом и возможность указать путь вручную; нет автообновления конфига
    Pinterest, нет плейлистов, нет других соцсетей в этой задаче; авторизация: в GUI
    только вставка токена/cookie, без ввода пароля; хранение токена в системном хранилище
    (keyring), пароль не хранится.'
  source: user
  nfr: false
- id: R5
  text: 'NFR: локальное приложение без сервера и внешней сети; платформа Linux/KDE
    (код не должен быть Linux-привязанным без нужды); память до ~100 МБ RAM, файлы
    до ~50 МБ, альбом до ~1000 картинок; UI не подвисает во время загрузки — загрузки
    в отдельных потоках/процессах, реакция на ввод мгновенная; Python 3.11+, PySide6,
    зависимости в pyproject.toml, gallery-dl ставится системно отдельно; запуск бинарником
    через ярлык в меню приложений; drag-and-drop поддерживается; лимит на число одновременных
    загрузок не задаётся — упирается в возможности машины; сборка в один файл (PyInstaller)
    — решение разработчика, обязан быть ярлык в меню приложений.'
  source: user
  nfr: true
- id: R6
  text: 'границы: не входит: видео YouTube/TikTok и другие соцсети (только архитектурная
    возможность расширения), авторизация по логину/паролю, плейлисты и ''сохранённые''
    Pinterest, загрузка по ключевым словам/поиску, планировщик/автозагрузка, мультиаккаунт,
    телеграм/бот-интерфейс, снятие ограничений доступа Pinterest.'
  source: user
  nfr: false
- id: AC1
  text: 'критерии приёмки: 1) приложение запускается с ярлыка в меню приложений KDE
    (имя ''Gallary Downloader'', логотип из logo/); 2) вставка ссылки на одну картинку
    Pinterest и ''Скачать'' → файл появляется в выбранной папке; 3) вставка ссылки
    на альбом → скачиваются все картинки альбома; 4) в окне видно прогресс по текущей
    загрузке, скорость, ''скачано X из Y'', имя/путь папки сохранения, при завершении
    — итог (скачано/пропущено/ошибок); 5) смена папки сохранения работает и сохраняется
    между запусками; 6) несколько загрузок идут одновременно независимо; 7) приложение
    не падает при неверной ссылке, недоступной сети, отсутствии gallery-dl — показывает
    сообщение и продолжает работать; 8) unit-тесты проходят, есть тест на определение
    ''ссылка на картинку vs альбом''; приёмка включает реальную загрузку из сети по
    ссылкам из файла links.txt в корне проекта.'
  source: user
  nfr: false
