# Словарь предметной области приложения Snipnest.
# Каждое значение перечисления — цитата из дословной записи интервью T2.
# Цитата сверяется побайтово: пересказ не пройдёт.

enums:
  role:
    - id: владелец
      label: "единственный пользователь приложения; он же владелец продукта"
      transcript: T2
      quote: "Пользоваться буду только я."
    - id: загрузка
      label: "автоматический исполнитель: внешний бинарник gallery-dl"
      transcript: T2
      quote: "Да, было бы отлично сделать приложение автономным."

  state:
    - id: в_очереди
      label: "ссылка принята, загрузка ждёт своей очереди"
      transcript: T2
      quote: "4. Допускается несколько загрузок одновременно"
    - id: выполняется
      label: "идёт скачивание: видны прогресс, скорость и счётчик"
      transcript: T2
      quote: "Оставляй умолчание, но добавь еще скорость загрузки и сколько сколько скачано «скачано X из Y»."
    - id: завершена
      label: "скачивание закончилось, показан итог: скачано, пропущено, ошибок"
      transcript: T2
      quote: "Да, оставляй так с итогом."
    - id: ошибка
      label: "загрузка не удалась: приложение показывает сообщение и предлагает повторить"
      transcript: T2
      quote: "Оставляй."
    - id: отменена
      label: "пользователь остановил загрузку"
      transcript: T2
      quote: "4. Допускается несколько загрузок одновременно"

  field:
    - id: ссылка
      label: "ссылка Pinterest: на одну картинку или на альбом"
      transcript: T2
      quote: "Да, одно поле."
    - id: папка_сохранения
      label: "каталог, куда складываются скачанные файлы; меняется пользователем и запоминается"
      transcript: T2
      quote: "Оставляй умолчание, но у меня ru-локаль, так что у меня это будет `/home/sato/Изображения/Pinterest/`"
    - id: прогресс
      label: "доля выполненного по текущей загрузке"
      transcript: T2
      quote: "Оставляй умолчание, но добавь еще скорость загрузки и сколько сколько скачано «скачано X из Y»."
    - id: скорость
      label: "текущая скорость загрузки"
      transcript: T2
      quote: "Оставляй умолчание, но добавь еще скорость загрузки и сколько сколько скачано «скачано X из Y»."
    - id: список_файлов
      label: "имена скачанных файлов текущей загрузки"
      transcript: T2
      quote: "Да, оставляй умолчание."
    - id: токен_pinterest
      label: "токен или cookie Pinterest, вводится в GUI и хранится в системном хранилище"
      transcript: T2
      quote: "Желательно что бы было безопаснее, что бы нельзя было просто достать куки или еще что-то."
    - id: путь_к_gallery_dl
      label: "путь к бинарнику gallery-dl, если он не найден в PATH"
      transcript: T2
      quote: "Оставляй."
    - id: лог
      label: "вывод gallery-dl, показывается для диагностики"
      transcript: T2
      quote: "Да, оставляй умолчание."
