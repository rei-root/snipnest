terminal: [завершена]

transitions:
  - id: TR-001
    event: ссылка_принята
    to: в_очереди
    initiator:
      - владелец
    action: отменить
  - id: TR-002
    from: в_очереди
    event: запуск
    to: выполняется
    initiator:
      - загрузка
    action: отменить
  - id: TR-003
    from: выполняется
    event: файлы_скачаны
    to: завершена
    initiator:
      - загрузка
    action: отменить
  - id: TR-004
    from: выполняется
    event: сбой
    to: ошибка
    initiator:
      - загрузка
    action: отменить
  - id: TR-005
    from: выполняется
    event: остановка_пользователем
    to: отменена
    initiator:
      - владелец
    action: отменить
  - id: TR-006
    from: в_очереди
    event: остановка_пользователем
    to: отменена
    initiator:
      - владелец
    action: отменить
  - id: TR-007
    from: ошибка
    event: повтор
    to: в_очереди
    initiator:
      - владелец
    action: повторить
  - id: TR-008
    from: отменена
    event: повтор
    to: в_очереди
    initiator:
      - владелец
    action: повторить
  - id: TR-009
    from: в_очереди
    event: запуск
    to: выполняется
    initiator:
      - загрузка
    action: выполнить
    supersedes: TR-002
    reason: 'дуга ссылалась на право отменить, которого у исполнителя нет: запуск загрузки — это действие выполнить'
  - id: TR-010
    from: выполняется
    event: файлы_скачаны
    to: завершена
    initiator:
      - загрузка
    action: отчитаться
    supersedes: TR-003
    reason: 'дуга ссылалась на право отменить, которого у исполнителя нет: подведение итога — это действие отчитаться'
  - id: TR-011
    from: выполняется
    event: сбой
    to: ошибка
    initiator:
      - загрузка
    action: отчитаться
    supersedes: TR-004
    reason: 'дуга ссылалась на право отменить, которого у исполнителя нет: сообщение о сбое — это действие отчитаться'
