facts:
  - id: FACT-001
    slot: rights[владелец,отменить,в_очереди]
    value: allow
    source: user
    transcript: T2
    quote: Допускается несколько загрузок одновременно
  - id: FACT-002
    slot: rights[владелец,отменить,выполняется]
    value: allow
    source: derived
    rationale: 'владелец останавливает идущую загрузку: из выполняется есть дуга TR-005 по событию остановка_пользователем с инициатором владелец'
    derives_from:
      - TR-005
  - id: FACT-003
    slot: rights[владелец,отменить,завершена]
    value: deny
    source: derived
    rationale: 'из завершена в графе нет исходящих дуг: загрузка уже отчиталась, отменять нечего'
    derives_from:
      - graph
  - id: FACT-004
    slot: rights[владелец,отменить,ошибка]
    value: deny
    source: derived
    rationale: из ошибки исходящая дуга только повтор (TR-007); отменять нечего — загрузка уже остановилась сама
    derives_from:
      - TR-007
  - id: FACT-005
    slot: rights[владелец,отменить,отменена]
    value: deny
    source: derived
    rationale: из отменена исходящая дуга только повтор (TR-008); отменять уже отменённую загрузку бессмысленно
    derives_from:
      - TR-008
  - id: FACT-006
    slot: rights[владелец,повторить,в_очереди]
    value: deny
    source: derived
    rationale: повтор есть только из ошибки (TR-007) и отменена (TR-008); из в_очереди повтор не выводится
    derives_from:
      - TR-007
      - TR-008
  - id: FACT-007
    slot: rights[владелец,повторить,выполняется]
    value: deny
    source: derived
    rationale: повтор есть только из ошибки (TR-007) и отменена (TR-008); идущую загрузку не повторяют, её ждут
    derives_from:
      - TR-007
      - TR-008
  - id: FACT-008
    slot: rights[владелец,повторить,завершена]
    value: deny
    source: derived
    rationale: завершена — терминальное состояние, повтор из него не выводится
    derives_from:
      - graph
  - id: FACT-009
    slot: rights[владелец,повторить,ошибка]
    value: allow
    source: user
    transcript: T2
    quote: Оставляй.
  - id: FACT-010
    slot: rights[владелец,повторить,отменена]
    value: allow
    source: derived
    rationale: 'из отменена есть дуга повтор (TR-008) с инициатором владелец: отменённую загрузку можно запустить заново'
    derives_from:
      - TR-008
  - id: FACT-011
    slot: rights[загрузка,отменить,в_очереди]
    value: n/a
    source: derived
    rationale: 'gallery-dl не отменяет загрузку, пока она в очереди: решение об отмене принимает владелец'
    derives_from:
      - graph
  - id: FACT-012
    slot: rights[загрузка,отменить,выполняется]
    value: n/a
    source: derived
    rationale: отмену инициирует владелец (TR-005); исполнитель не инициирует отмену, а подчиняется ей
    derives_from:
      - TR-005
  - id: FACT-013
    slot: rights[загрузка,отменить,завершена]
    value: n/a
    source: derived
    rationale: завершена — терминальное состояние, отмена в нём неприменима
    derives_from:
      - graph
  - id: FACT-014
    slot: rights[загрузка,отменить,ошибка]
    value: n/a
    source: derived
    rationale: из ошибки выходит только повтор (TR-007) по решению владельца
    derives_from:
      - TR-007
  - id: FACT-015
    slot: rights[загрузка,отменить,отменена]
    value: n/a
    source: derived
    rationale: из отменена выходит только повтор (TR-008) по решению владельца
    derives_from:
      - TR-008
  - id: FACT-016
    slot: rights[загрузка,повторить,в_очереди]
    value: n/a
    source: derived
    rationale: повтор инициирует владелец (TR-007, TR-008), исполнитель сам не перезапускает загрузку
    derives_from:
      - TR-007
      - TR-008
  - id: FACT-017
    slot: rights[загрузка,повторить,выполняется]
    value: n/a
    source: derived
    rationale: повтор инициирует владелец (TR-007, TR-008), исполнитель сам не перезапускает загрузку
    derives_from:
      - TR-007
      - TR-008
  - id: FACT-018
    slot: rights[загрузка,повторить,завершена]
    value: n/a
    source: derived
    rationale: завершена — терминальное состояние, повтор в нём неприменим
    derives_from:
      - graph
  - id: FACT-019
    slot: rights[загрузка,повторить,ошибка]
    value: n/a
    source: derived
    rationale: повтор инициирует владелец (TR-007), исполнитель не перезапускает загрузку сам
    derives_from:
      - TR-007
  - id: FACT-020
    slot: rights[загрузка,повторить,отменена]
    value: n/a
    source: derived
    rationale: повтор инициирует владелец (TR-008), исполнитель не перезапускает загрузку сам
    derives_from:
      - TR-008
  - id: FACT-021
    slot: visibility[владелец,в_очереди]
    value: limited
    source: derived
    rationale: 'в очереди загрузка ещё не идёт: видны ссылка и папка сохранения, но ни прогресса, ни скорости, ни файлов ещё нет'
    derives_from:
      - TR-002
  - id: FACT-022
    slot: visibility[владелец,выполняется]
    value: full
    source: user
    transcript: T2
    quote: Оставляй умолчание, но добавь еще скорость загрузки и сколько сколько скачано «скачано X из Y».
  - id: FACT-023
    slot: visibility[владелец,завершена]
    value: full
    source: user
    transcript: T2
    quote: Да, оставляй так с итогом.
  - id: FACT-024
    slot: visibility[владелец,ошибка]
    value: full
    source: user
    transcript: T2
    quote: Оставляй.
  - id: FACT-025
    slot: visibility[владелец,отменена]
    value: full
    source: derived
    rationale: 'после отмены владельцу доступен итог по загрузке и лог: иначе он не поймёт, что именно прервалось'
    derives_from:
      - TR-005
      - TR-006
  - id: FACT-026
    slot: visibility[загрузка,в_очереди]
    value: limited
    source: derived
    rationale: исполнитель в очереди не работает; ему доступны только параметры запуска, которые получит при старте
    derives_from:
      - TR-002
  - id: FACT-027
    slot: visibility[загрузка,выполняется]
    value: full
    source: derived
    rationale: 'исполнитель в ходе загрузки видит всё, что касается его работы: файлы, счётчики, лог'
    derives_from:
      - TR-003
      - TR-004
  - id: FACT-028
    slot: visibility[загрузка,завершена]
    value: full
    source: derived
    rationale: 'исполнитель доводит загрузку до конца и отдаёт результат: он видит всё своё состояние'
    derives_from:
      - TR-003
  - id: FACT-029
    slot: visibility[загрузка,ошибка]
    value: full
    source: derived
    rationale: 'исполнитель знает, чем загрузка кончилась: без этого он не может отдать владельцу диагностику'
    derives_from:
      - TR-004
  - id: FACT-030
    slot: visibility[загрузка,отменена]
    value: full
    source: derived
    rationale: исполнитель останавливается по команде владельца и знает, что произошло
    derives_from:
      - TR-005
      - TR-006
  - id: FACT-031
    slot: field_owner[ссылка]
    value: владелец
    source: user
    transcript: T2
    quote: Да, одно поле.
  - id: FACT-032
    slot: field_owner[папка_сохранения]
    value: владелец
    source: user
    transcript: T2
    quote: Оставляй умолчание, но у меня ru-локаль, так что у меня это будет `/home/sato/Изображения/Pinterest/`
  - id: FACT-033
    slot: field_owner[прогресс]
    value: загрузка
    source: derived
    rationale: 'прогресс идёт от исполнителя: он считает скачанное и сообщает состояние'
    derives_from:
      - TR-003
  - id: FACT-034
    slot: field_owner[скорость]
    value: загрузка
    source: derived
    rationale: скорость измеряет исполнитель по факту передачи файлов
    derives_from:
      - TR-003
  - id: FACT-035
    slot: field_owner[список_файлов]
    value: загрузка
    source: derived
    rationale: имена файлов знает только тот, кто их качает
    derives_from:
      - TR-003
  - id: FACT-036
    slot: field_owner[токен_pinterest]
    value: владелец
    source: user
    transcript: T2
    quote: Желательно что бы было безопаснее, что бы нельзя было просто достать куки или еще что-то.
  - id: FACT-037
    slot: field_owner[путь_к_gallery_dl]
    value: владелец
    source: derived
    rationale: 'путь к бинарнику указывает владелец, если gallery-dl не найден в PATH: выбор пути — его решение'
  - id: FACT-038
    slot: field_owner[лог]
    value: загрузка
    source: derived
    rationale: лог — это вывод внешнего бинарника, он попадает в поле от исполнителя
  - id: FACT-039
    slot: field_after_send[ссылка]
    value: frozen
    source: derived
    rationale: ссылка определяет, что именно качать; после старта её смена означала бы другую загрузку
    derives_from:
      - TR-002
  - id: FACT-040
    slot: field_after_send[папка_сохранения]
    value: editable
    source: derived
    rationale: 'папку сохранения меняют в любой момент: это каталог назначения, а не часть содержимого загрузки'
  - id: FACT-041
    slot: field_after_send[прогресс]
    value: frozen
    source: derived
    rationale: прогресс — отчёт о том, что уже произошло; его не редактируют, его выдаёт исполнитель
    derives_from:
      - TR-003
  - id: FACT-042
    slot: field_after_send[скорость]
    value: frozen
    source: derived
    rationale: скорость — измерение, его не редактируют вручную
    derives_from:
      - TR-003
  - id: FACT-043
    slot: field_after_send[список_файлов]
    value: frozen
    source: derived
    rationale: список файлов — отчёт о факте скачанного, а не ввод пользователя
    derives_from:
      - TR-003
  - id: FACT-044
    slot: field_after_send[токен_pinterest]
    value: editable
    source: derived
    rationale: 'токен можно заменить в любой момент: он не часть постановки загрузки, а условие доступа к сайту'
  - id: FACT-045
    slot: field_after_send[путь_к_gallery_dl]
    value: editable
    source: derived
    rationale: путь к бинарнику — настройка окружения, её правят когда угодно
  - id: FACT-046
    slot: field_after_send[лог]
    value: frozen
    source: derived
    rationale: лог — поток вывода исполнителя, его не редактируют
  - id: FACT-047
    slot: reversible[отменить]
    value: "yes"
    source: derived
    rationale: отменённую загрузку можно повторить (TR-008), то есть отмена обратима
    derives_from:
      - TR-008
  - id: FACT-048
    slot: reversible[повторить]
    value: "no"
    source: derived
    rationale: повтор запускает новую попытку; отменить саму попытку нельзя, отмена относится к загрузке, а не к её повтору
    derives_from:
      - TR-007
      - TR-008
  - id: FACT-049
    slot: state_timeout[в_очереди]
    value: 'нет: загрузка ждёт в очереди, пока владелец не остановит её или не освободится место'
    source: derived
    rationale: 'очередь не имеет срока: число параллельных загрузок ограничено только возможностями машины, а ожидание не истекает'
    derives_from:
      - TR-001
  - id: FACT-050
    slot: state_timeout[выполняется]
    value: 'нет: загрузка идёт, пока файлы не скачаны, не сорвётся и не будет остановлена владельцем'
    source: derived
    rationale: из выполняется выходят три дуги (TR-003, TR-004, TR-005), ни одна из них не привязана к сроку
    derives_from:
      - TR-003
      - TR-004
      - TR-005
  - id: FACT-051
    slot: state_timeout[завершена]
    value: 'нет: итог показывается, пока пользователь не уберёт загрузку из списка'
    source: derived
    rationale: завершена — терминальное состояние, из него выходов в графе нет, значит срок не применим
  - id: FACT-052
    slot: state_timeout[ошибка]
    value: 'нет: ошибка ждёт решения владельца — повторить или убрать'
    source: derived
    rationale: из ошибки выходит только повтор (TR-007); срока, по которому ошибка рассыпается сама, нет
    derives_from:
      - TR-007
  - id: FACT-053
    slot: state_timeout[отменена]
    value: 'нет: отменённая загрузка ждёт решения владельца — повторить или убрать'
    source: derived
    rationale: из отменена выходит только повтор (TR-008); срока, по которому отмена рассыпается сама, нет
    derives_from:
      - TR-008
  - id: FACT-054
    slot: visibility[владелец,в_очереди]
    value: limited
