facts:
- id: R1
  text: 'Snipnest — GUI-обёртка над gallery-dl и yt-dlp для Linux. Сейчас программа существует только
    как исходники в репозитории и запускается из venv через uv: поставить её на машину обычного пользователя
    нельзя, а внешние программы (gallery-dl, yt-dlp, ffmpeg) человек должен ставить сам — и не всегда
    ставит. Нужны готовые артефакты: один исполняемый бинарник, AppImage и .deb для debian-based дистрибутивов.
    И приложение должно само обеспечивать внешние программы — но не скрытно, а через список, из которого
    человек сам выбирает, что ставить.'
  source: user
  nfr: false
- id: R2
  text: 'Владелец проекта — он же заказчик, работает в Linux/KDE, и решения об ограничениях (в том числе
    запрет качать скрипты задачи во время загрузки) принимает он. Конечный пользователь — обычный человек
    с Linux-машиной без Python-разработчика: он ставит .deb или AppImage и хочет, чтобы после установки
    всё работало. Сборщик — CI, который собирает артефакты по тегу. Сообщество — пользователи репозитория
    snipnest на GitHub, они же получают релизы.'
  source: user
  nfr: false
- id: R3
  text: '1) собирается один исполняемый бинарник snipnest (onefile), который запускается на машине без
    Python в системе; 2) собирается AppImage: AppDir с AppRun, desktop-файлом и иконкой, упакованный в
    образ type 2; 3) собирается .deb для debian-based: файлы приложения в /usr/lib/snipnest, лаунчер в
    /usr/bin/snipnest, ярлык в /usr/share/applications, иконки в /usr/share/icons; Depends — только libc6,
    всё остальное внутри пакета; 4) в приложении есть мастер установки компонентов: дерево с корневым
    пунктом «Обеспечить все компоненты» и пятью дочерними пунктами (gallery-dl, yt-dlp, yt-dlp-ejs, deno,
    ffmpeg), у каждого свой чекбокс; 5) корневой пункт отмечен по умолчанию, снятие корневой галочки снимает
    все, ручная отметка части детей переводит корневой пункт в состояние «частично»; 6) у каждого компонента
    показан статус: «уже установлен в системе», «будет скачано, ~12 МБ» или «установлен системным пакетом»;
    7) компоненты ставятся в ~/.local/share/snipnest/components/<имя>/ без прав root; 8) мастер показывается
    при первом запуске и вызывается из интерфейса кнопкой «Компоненты…»; 9) приложение находит установленные
    компоненты и использует их вместо системных, если те есть; 10) Python-компоненты (gallery-dl, yt-dlp,
    yt-dlp-ejs) ставятся переносимым CPython, входящим в артефакт, и запускаются им; 11) deno и ffmpeg
    ставятся готовыми бинарниками; 12) в .deb компоненты предустановлены в /usr/lib/snipnest/components,
    и мастер показывает их как установленные.'
  source: user
  nfr: false
- id: R4
  text: '1) ничего не скачивается без согласия человека: без отметки в списке компонент не ставится; 2)
    компонент, уже найденный в системе (gallery-dl или yt-dlp в PATH), повторно не скачивается; 3) путь
    к установленному компоненту прописывается в настройки приложения, и путь, заданный руками, не перетирается
    без согласия человека; 4) скрипты задачи YouTube из сети во время загрузки не качаются — решение владельца,
    оно действует и для мастера компонентов; 5) установка идёт в каталог пользователя и не требует прав
    root; 6) файлы .deb не перетирают чужие: раскладка ограничена /usr/lib/snipnest, /usr/bin/snipnest,
    /usr/share/applications и /usr/share/icons; 7) приложение не ломается, если компонент не установлен:
    показывается сообщение и остаются прежние кнопки «Путь к gallery-dl» и «Путь к yt-dlp».'
  source: user
  nfr: false
- id: R5
  text: '1) архитектура только amd64, версия пакета 0.2.0; 2) правила репозитория прежние: ruff с line-length
    100, mypy --strict, не больше 300 строк на файл, аннотации типов везде, запрещён print() в продовом
    коде; 3) тесты, кроме помеченных live, в сеть не ходят; 4) знаменатель обязательств остаётся 89/89,
    нормативная модель не меняется; 5) окно не подвисает: установка компонентов идёт в отдельном потоке,
    события переносятся в GUI-поток через сигналы Qt; 6) артефакты собираются в CI по тегу (GitHub Actions)
    и выкладываются в Releases.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: сборка под arm64 и другие архитектуры, Windows и macOS, подпись и нотарификация артефактов,
    flatpak и snap, автообновление приложения, установка компонентов через системный пакетный менеджер
    (apt) и через pip в системное окружение, изменение нормативной модели предметной области и её 89 обязательств,
    переписывание дословных цитат интервью T2, изменение истории git.'
  source: user
  nfr: false
- id: AC1
  text: '1) make dist-onefile собирает один исполняемый файл, который запускается на машине без Python
    и показывает окно приложения; 2) make dist-appimage собирает AppImage: образ содержит .desktop, иконку
    и AppRun, а приложение после запуска появляется в меню; 3) make dist-deb собирает .deb, который проходит
    dpkg-deb --info и dpkg-deb --contents, распаковывается в отдельный корень через dpkg-deb -x и содержит
    лаунчер /usr/bin/snipnest, ярлык и иконки; 4) в .deb лежат все пять компонентов, и приложение после
    установки пакета находит их без сети; 5) мастер компонентов показывает дерево с корневым пунктом и
    пятью детьми, корневой пункт отмечен по умолчанию; 6) снятие корневой галочки снимает все дочерние,
    отметка одного ребёнка переводит корневой пункт в «частично»; 7) компонент, найденный в PATH, отмечен
    и помечен как уже установленный и не скачивается повторно; 8) установка отмеченного компонента кладёт
    его в ~/.local/share/snipnest/components и приложение начинает его использовать; 9) установка идёт
    в отдельном потоке, окно не подвисает; 10) полный прогон тестов, типов и линтеров зелёный, знаменатель
    89/89.'
  source: user
  nfr: false
