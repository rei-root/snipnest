facts:
- id: R1
  text: 'Сейчас в релизах один бинарник — это само приложение, и поставить его в систему нечем: на машине
    пользователя нет менеджера пакетов для «просто файла», а AppImage — это тоже не установка, а запуск
    из архива. Нужен отдельный установщик: один файл, который сам определяет дистрибутив и ставит приложение
    его родным способом. Приложения внутри установщика быть не должно — установщик его скачивает.'
  source: user
  nfr: false
- id: R2
  text: 'Владелец проекта — он же заказчик, решает, что установщик должен и чего не должен. Конечный пользователь
    — обычный человек с Linux-машиной: у него нет Python, нет прав администратора и нет желания разбираться
    с форматами. Сборщик — CI, который собирает установщик по тегу и кладёт его в релиз.'
  source: user
  nfr: false
- id: R3
  text: '1) собирается dist/snipnest-installer-linux-amd64.bin — один файл установщика, приложения внутри
    нет; 2) установщик определяет семейство дистрибутива по /etc/os-release: debian-based, arch-based,
    rhel-based, suse-based, gentoo, alpine — и всё, что не опознано; 3) на debian-based ставит .deb через
    apt-get (запасной путь — dpkg); 4) на остальных кладёт переносимый образ в /opt/snipnest, делает лаунчер
    в /usr/local/bin, ярлык в /usr/share/applications и иконки в /usr/share/icons/hicolor; 5) ключ --user
    ставит всё в домашний каталог, без прав root; 6) ключ --dry-run печатает план и ничего не делает;
    7) ключ --local ставит из локального файла, без сети; 8) установщик скачивает файл из релизов и проверяет
    его по SHA256SUMS; 9) перед установкой проверяется версия glibc: если она ниже нужной, установщик
    говорит об этом и не ставит; 10) перед установкой в систему установщик спрашивает подтверждение, ключ
    --yes отвечает заранее; 11) AppImage собирается как приложение, установщика внутри нет; 12) имя AppImage
    содержит платформу, версию glibc и архитектуру: snipnest-<версия>-linux-glibc-<версия>-x86_64.AppImage;
    13) пакет .deb не меняется.'
  source: user
  nfr: false
- id: R4
  text: '1) установщик сначала печатает, что собирается сделать, и спрашивает подтверждение перед установкой
    в систему; 2) права администратора берутся только когда они действительно нужны — для системных каталогов;
    3) установщик не трогает чужие файлы: свои пути он проверяет и о перезаписи предупреждает; 4) приложения
    внутри установщика нет — только скрипт установки; 5) компоненты (gallery-dl, yt-dlp, ffmpeg) установщик
    не ставит — этим занимается мастер внутри приложения; 6) установщик не ломает систему: пакетным менеджером
    он ставит только свой пакет.'
  source: user
  nfr: false
- id: R5
  text: '1) архитектура только amd64, версия 0.2.0; 2) установщик написан на POSIX shell и работает там,
    где есть /bin/sh: ни Python, ни Qt ему не нужны; 3) правила репозитория прежние: ruff с line-length
    100, mypy --strict, не больше 300 строк на файл, аннотации типов везде, комментарии в коде по-английски;
    4) тесты, кроме помеченных live, в сеть не ходят; 5) знаменатель обязательств остаётся 89/89; 6) артефакты
    собираются в CI по тегу и выкладываются в Releases.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: сборка под arm64 и другие архитектуры, Windows и macOS, собственные .rpm и .pkg.tar.zst
    для rhel- и arch-систем, графический установщик, автообновление установщика, подпись артефактов, flatpak
    и snap, изменение нормативной модели предметной области и её 89 обязательств, переписывание дословных
    цитат интервью T2, изменение истории git.'
  source: user
  nfr: false
- id: AC1
  text: '1) make dist-installer собирает dist/snipnest-installer-linux-amd64.bin — один файл установщика;
    2) установщик запускается как ./snipnest-installer-linux-amd64.bin --help и печатает справку; 3) установщик
    с ключом --dry-run на debian-, arch-, rhel- и на неизвестной системе печатает разный план: для debian
    — установку .deb через apt-get, для остальных — образ в /opt с лаунчером и ярлыком; 4) с ключом --user
    план ставит всё в домашний каталог; 5) внутри файла установщика нет приложения: в нём нет ни одного
    ELF-файла приложения и нет каталога _internal; 6) AppImage собирается как приложение: внутри него
    нет установщика, зато есть .desktop, иконка и AppRun; 7) имя AppImage содержит платформу, версию glibc
    и архитектуру; 8) пакет .deb собирается как раньше и не меняется; 9) полный прогон тестов, типов и
    линтеров зелёный, знаменатель 89/89.'
  source: user
  nfr: false
