facts:
- id: R1
  text: 'Владелец обнаружил: видео с YouTube не скачивается совсем. В логе приложения
    — «Only images are available for download» и «ERROR: Requested format is not available»:
    форматов у ролика нет вообще. Причина найдена и подтверждена: в каталоге компонентов
    закреплена версия yt-dlp 2026.10.26, а на текущем плеере YouTube (b485e332) она
    не решает n challenge — солвер падает с «a.addOnDisposeCallback is not a function»
    одинаково и в deno, и в node, то есть дело не в рантайме. Исправление вышло в
    стабильном релизе yt-dlp 2026.11.23 (yt-dlp#18123, ответ мейнтейнера: «Fixed in
    stable 2026.11.23. Update your yt-dlp.»). Проверено на машине владельца: с 2026.11.23
    форматы видны и ролик скачивается.'
  source: user
  nfr: false
- id: R2
  text: Пользователь один — владелец, приложение личное и локальное, запускается на
    его машине в графическом сеансе KDE. Мастер установки компонентов — часть приложения,
    а не отдельный сервис; новых ролей и внешних сервисов не появляется.
  source: user
  nfr: false
- id: R3
  text: '1) Каталог компонентов закрепляет yt-dlp версией не ниже 2026.11.23 — конкретно
    2026.11.23, последней стабильной на 2026-11-26. 2) Версия yt-dlp-ejs остаётся
    прежней (0.8.0): она совместима с yt-dlp 2026.11.23, и солвер берёт из неё скрипты
    v0.8.0. 3) Мастер установки ставит закреплённую версию, и приложение находит бинарь
    в каталоге компонентов раньше, чем системный: так обновление доезжает до владельца.
    4) Есть тест, который падает, если закреплённая версия yt-dlp ниже 2026.11.23:
    откат на сломанную версию должен быть виден сразу, а не после жалоб на «не скачивается».
    5) После обновления ролик с YouTube отдаёт список форматов и скачивается; на прежней
    версии форматов не было вовсе.'
  source: user
  nfr: false
- id: R4
  text: '1) Версии компонентов закрепляются точно, как и прежде: никаких «последних»
    и плавающих версий. 2) Обновляется только yt-dlp: gallery-dl, yt-dlp-ejs, deno
    и ffmpeg остаются на прежних версиях — проверено, что они с новым yt-dlp работают.
    3) Уже установленный компонент переустанавливается через мастер установки: он
    и так ставит закреплённую версию, отдельного механизма обновления не нужно. 4)
    Нормативная модель предметной области не меняется, 89 обязательств остаются в
    силе: версия компонента — параметр окружения, а не поле модели. 5) Провайдер PO-токена
    в задачу не входит: часть роликов YouTube отдаёт только первые два мегабайта потока,
    и это отдельное решение владельца.'
  source: user
  nfr: false
- id: R5
  text: 'тесты, кроме помеченных live, в сеть не ходят; правила репозитория прежние:
    ruff с line-length 100, mypy --strict, не больше 300 строк на файл, аннотации
    типов везде; знаменатель обязательств остаётся 89/89; проверка версии делается
    без сети — сравнением строк версий.'
  source: user
  nfr: true
- id: R6
  text: 'вне задачи: провайдер PO-токена (bgutil) и любой другой способ обойти требование
    PO-токена, автоматическое обновление компонентов при выходе новых версий, переход
    на другие клиенты YouTube (web_safari, android_vr), откат на прежние версии компонентов,
    обновление gallery-dl, yt-dlp-ejs, deno и ffmpeg, изменение нормативной модели
    предметной области, изменение истории git.'
  source: user
  nfr: false
- id: AC1
  text: 1) В каталоге компонентов yt-dlp закреплён версией 2026.11.23, а yt-dlp-ejs
    — 0.8.0. 2) Тест на минимальную версию проходит; на версии 2026.10.26 тот же тест
    падает. 3) Мастер установки ставит yt-dlp закреплённой версии, и приложение находит
    его в каталоге компонентов. 4) На машине владельца ролик с YouTube отдаёт список
    форматов (а не «Only images are available for download») и скачивается целиком.
    5) Полный прогон тестов, типов и линтеров зелёный, знаменатель 89/89.
  source: user
  nfr: false
